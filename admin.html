<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坐忘茗舍 · 管理后台</title>
<script src="assets/vendor/supabase-js@2.112.4.min.js"></script>
<script src="assets/vendor/fullcalendar@6.1.15.global.min.js"></script>
<script src="assets/vendor/fullcalendar-locale-zh-cn@6.1.15.global.min.js"></script>
<style>
  :root {
    --bg: #F7F3EC;
    --surface: #EFEAD8;
    --ink: #1C2B2B;
    --ink-muted: #4A5C5A;
    --gold: #A8894A;
    --gold-soft: #EDE4CE;
    --sage: #6B8C7A;
    --border: #D8D0C0;
    --red: #9B4A3E;
    --red-soft: #F2E0DC;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; font-size: 15px; line-height: 1.6; }

  /* 登录页 */
  #loginPage {
    min-height: 100vh;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .login-box {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px;
    width: 360px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  .login-box h1 {
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .login-box p { color: var(--ink-muted); font-size: 13px; margin-bottom: 28px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
  .form-group input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    background: var(--bg);
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus { border-color: var(--gold); }
  .btn-primary {
    width: 100%;
    padding: 12px;
    background: var(--gold);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.2s;
  }
  .btn-primary:hover { opacity: 0.85; }
  .error-msg { color: var(--red); font-size: 13px; margin-top: 12px; text-align: center; min-height: 20px; }

  /* 主后台 */
  #adminPage { display: none; }
  .top-bar {
    background: white;
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .top-bar-title { font-weight: 700; font-size: 17px; color: var(--ink); }
  .top-bar-right { display: flex; align-items: center; gap: 16px; }
  .btn-logout {
    padding: 7px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: white;
    font-size: 13px;
    cursor: pointer;
    color: var(--ink-muted);
  }
  .btn-logout:hover { background: var(--bg); }

  .admin-layout { display: flex; min-height: calc(100vh - 60px); }

  /* 侧边栏 */
  .sidebar {
    width: 220px;
    background: white;
    border-right: 1px solid var(--border);
    padding: 24px 0;
    flex-shrink: 0;
  }
  .sidebar-section { padding: 0 16px; margin-bottom: 32px; }
  .sidebar-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-muted);
    font-weight: 600;
    padding: 0 8px;
    margin-bottom: 4px;
  }
  .sidebar-item {
    display: block;
    padding: 9px 12px 9px 20px;
    border-radius: 8px;
    font-size: 14px;
    color: var(--ink-muted);
    cursor: pointer;
    transition: all 0.15s;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
  }
  .sidebar-item:hover { background: var(--bg); color: var(--ink); }
  .sidebar-item.active { background: var(--gold-soft); color: var(--gold); font-weight: 600; }

  /* 主内容 */
  .main-content { flex: 1; padding: 32px; overflow-auto; }
  .page-header { margin-bottom: 28px; display: flex; align-items: center; justify-content: space-between; }
  .page-title { font-size: 22px; font-weight: 700; }
  .page-subtitle { color: var(--ink-muted); font-size: 13px; margin-top: 4px; }

  .btn-add {
    padding: 10px 20px;
    background: var(--gold);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn-add:hover { opacity: 0.85; }

  /* 分类选择器 */
  .filter-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .filter-chip {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: white;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--ink-muted);
  }
  .filter-chip:hover { border-color: var(--gold); color: var(--gold); }
  .filter-chip.active { background: var(--gold); border-color: var(--gold); color: white; font-weight: 600; }

  /* 商品卡片列表 */
  .product-list { display: flex; flex-direction: column; gap: 10px; }
  .product-row {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .product-row img {
    width: 80px;
    aspect-ratio: 4 / 3;
    height: auto;
    object-fit: cover;
    border-radius: 8px;
    background: var(--bg);
    flex-shrink: 0;
  }
  .product-row .no-img {
    width: 80px;
    aspect-ratio: 4 / 3;
    height: auto;
    border-radius: 8px;
    background: var(--bg);
    border: 1px dashed var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: var(--ink-muted);
    flex-shrink: 0;
  }
  .product-info { flex: 1; }
  .product-name { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
  .product-meta { font-size: 12px; color: var(--ink-muted); }
  .product-actions { display: flex; gap: 8px; }
  .btn-edit, .btn-delete {
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: white;
    transition: all 0.15s;
  }
  .btn-edit:hover { border-color: var(--gold); color: var(--gold); }
  .btn-delete:hover { border-color: var(--red); color: var(--red); }
  .visibility-switch { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .vs-btn {
    padding: 5px 12px;
    font-size: 13px;
    cursor: pointer;
    border: none;
    background: white;
    color: var(--ink-muted);
    transition: all 0.15s;
  }
  .vs-btn:hover { background: var(--surface); }
  .vs-active-show { background: var(--sage) !important; color: white !important; }
  .vs-active-hide { background: var(--red-soft) !important; color: var(--red) !important; font-weight: 600; }
  .sort-btns { display: flex; flex-direction: column; gap: 2px; }
  .sort-btn { padding: 2px 8px; font-size: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; line-height: 1.4; color: var(--ink-muted); }
  .sort-btn:hover { background: #f5efe6; color: #8B6914; }
  .product-row[draggable="true"] { transition: box-shadow 0.15s; }
  .product-row.dragging { box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
  .badge-hidden {
    font-size: 11px;
    padding: 2px 8px;
    background: var(--red-soft);
    color: var(--red);
    border-radius: 10px;
    font-weight: 600;
  }

  /* 空状态 */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-muted);
  }
  .empty-state p { margin-top: 8px; font-size: 13px; }

  /* 模态框 */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    display: none;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white;
    border-radius: 12px;
    padding: 32px;
    width: 520px;
    max-width: 95vw;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 8px 40px rgba(0,0,0,0.15);
  }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 24px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
  .btn-cancel {
    padding: 10px 20px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: white;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-save {
    padding: 10px 24px;
    background: var(--gold);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .modal .form-group select {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    background: var(--bg);
    color: var(--ink);
    outline: none;
  }
  .modal .form-group textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    background: var(--bg);
    color: var(--ink);
    outline: none;
    resize: vertical;
    min-height: 80px;
    font-family: inherit;
  }
  .checkbox-row { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
  .checkbox-row input { width: 16px; height: 16px; cursor: pointer; }
  .checkbox-row label { font-size: 14px; color: var(--ink); cursor: pointer; }

  .toast {
    position: fixed;
    bottom: 32px;
    right: 32px;
    background: var(--ink);
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 9999;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .loading { text-align: center; color: var(--ink-muted); padding: 40px; }

  .upload-area {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s;
    color: var(--ink-muted);
    font-size: 13px;
    background: var(--bg);
  }
  .upload-area:hover { border-color: var(--gold); color: var(--gold); }
  .upload-area.drag-over { border-color: var(--gold); color: var(--gold); background: var(--gold-soft); }

  .upload-area.crop-frame {
    position: relative;
    overflow: hidden;
    padding: 0;
    width: 100%;
    max-width: 300px;
    aspect-ratio: 4 / 3;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    cursor: default;
  }
  .upload-area.crop-frame.has-image { cursor: grab; }
  .upload-area.crop-frame.dragging { cursor: grabbing; }
  .upload-area.crop-frame img {
    position: absolute;
    max-width: none;
    max-height: none;
    -webkit-user-drag: none;
    user-select: none;
  }
  .crop-controls { display: flex; align-items: center; gap: 8px; margin-top: 8px; max-width: 300px; }
  .crop-controls-label { font-size: 12px; color: var(--ink-muted); white-space: nowrap; }
  .crop-controls input[type=range] { flex: 1; accent-color: var(--gold); }
  .crop-controls button {
    font-size: 12px; padding: 5px 10px; border: 1px solid var(--border);
    background: var(--surface); border-radius: 6px; cursor: pointer; color: var(--ink-muted);
    white-space: nowrap;
  }
  .crop-controls button:hover { border-color: var(--gold); color: var(--gold); }

  .detail-img-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .detail-img-thumb { position: relative; width: 64px; height: 64px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); flex-shrink: 0; }
  .detail-img-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .detail-img-remove {
    position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%;
    background: rgba(0,0,0,0.6); color: white; border: none; font-size: 12px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .detail-img-remove:hover { background: var(--red); }

  /* 海报管理网格 */
  .poster-admin-grid { display: flex; flex-wrap: wrap; gap: 16px; }
  .poster-admin-card { width: 160px; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.08); }
  .poster-admin-img { width: 160px; aspect-ratio: 2/3; background-size: cover; background-position: center; background-color: var(--surface); }
  .poster-admin-title { font-size: 12px; padding: 6px 10px; color: var(--ink); font-weight: 600; }
  .poster-admin-actions { display: flex; gap: 5px; padding: 8px 10px; border-top: 1px solid var(--border); align-items: center; }
  .poster-admin-actions .poster-sort-col { display: flex; flex-direction: column; gap: 2px; }
  .poster-admin-actions .poster-sort-col .sort-btn { padding: 2px 8px; font-size: 11px; }
  .poster-admin-actions .btn-edit, .poster-admin-actions .btn-delete { flex: 1; }
  .poster-admin-vis { display: flex; border-top: 1px solid var(--border); }
  .poster-admin-vis .vs-btn { flex: 1; border-radius: 0; border: none; border-right: 1px solid var(--border); }
  .poster-admin-vis .vs-btn:last-child { border-right: none; }
  .poster-admin-img.is-hidden { opacity: 0.4; }

  /* 会员管理 */
  .member-row {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 10px;
  }
  .member-avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--gold-soft); color: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; flex-shrink: 0;
  }
  .member-info { flex: 1; min-width: 0; }
  .member-name { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
  .member-meta { font-size: 12px; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .member-search {
    width: 260px; max-width: 100%; padding: 9px 14px;
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; background: white; color: var(--ink); outline: none;
  }
  .member-search:focus { border-color: var(--gold); }

  .member-detail-modal .modal { width: 640px; }
  .member-detail-section { margin-top: 24px; }
  .member-detail-section h4 {
    font-size: 14px; font-weight: 700; color: var(--ink);
    margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .package-row, .purchase-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 8px; font-size: 13px; background: var(--bg);
  }
  .package-row .pkg-info, .purchase-row .pur-info { flex: 1; min-width: 0; }
  .package-row .pkg-name { font-weight: 600; margin-bottom: 2px; }
  .package-row .pkg-hours { color: var(--ink-muted); font-size: 12px; }
  .purchase-row .pur-item { font-weight: 600; margin-bottom: 2px; }
  .purchase-row .pur-meta { color: var(--ink-muted); font-size: 12px; }
  .btn-deduct {
    padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
    border: 1px solid var(--sage); background: white; color: var(--sage); font-weight: 600;
  }
  .btn-deduct:hover { background: var(--sage); color: white; }
  .btn-deduct:disabled { opacity: 0.4; cursor: not-allowed; border-color: var(--border); color: var(--ink-muted); background: white; }
  .btn-mini-delete {
    padding: 5px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;
    border: 1px solid var(--border); background: white; color: var(--ink-muted);
  }
  .btn-mini-delete:hover { border-color: var(--red); color: var(--red); }
  .add-inline-form {
    display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap;
  }
  .add-inline-form input {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 13px; background: white; color: var(--ink); outline: none;
  }
  .add-inline-form input:focus { border-color: var(--gold); }
  .add-inline-form .btn-add-inline {
    padding: 8px 14px; background: var(--gold); color: white; border: none;
    border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;
  }

  /* 行程日历 */
  #calendarEl {
    background: white; border: 1px solid var(--border); border-radius: 10px; padding: 16px;
  }

  @media (max-width: 680px) {
    /* 顶栏 */
    .top-bar { padding: 0 16px; }
    .top-bar-title { font-size: 15px; }
    .top-bar-right { gap: 6px; }
    .btn-logout { padding: 6px 10px; font-size: 12px; }
    #userEmail { display: none; }

    /* 布局：侧边栏变顶部横条 */
    .admin-layout { flex-direction: column; }
    .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); padding: 12px 0 4px; }
    .sidebar-section { padding: 0 12px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .sidebar-label { display: none; }
    .sidebar-item { display: inline-block; width: auto; padding: 7px 14px; font-size: 13px; border-radius: 20px; border: 1px solid var(--border); }
    .sidebar-item.active { border-color: var(--gold); }

    /* 主内容 */
    .main-content { padding: 16px; }
    .page-title { font-size: 18px; }
    .page-header { flex-wrap: wrap; gap: 10px; }
    .btn-add { padding: 8px 14px; font-size: 13px; }

    /* 商品行 */
    .product-row { flex-wrap: wrap; gap: 10px; padding: 12px; }
    .product-row img, .product-row .no-img { width: 92px; aspect-ratio: 4 / 3; height: auto; }
    .product-info { flex: 1; min-width: 0; }
    .product-name { font-size: 14px; }
    .product-actions { width: 100%; justify-content: flex-end; gap: 6px; }
    .btn-edit, .btn-delete { padding: 6px 12px; font-size: 12px; }
    .vs-btn { padding: 6px 10px; font-size: 12px; }
    .sort-btn { padding: 4px 10px; }

    /* 会员行 */
    .member-row { flex-wrap: wrap; gap: 10px; padding: 12px; }
    .member-search { width: 100%; }
    .member-detail-modal .modal { width: 95vw; padding: 20px; }
    .add-inline-form { flex-direction: column; }
    .add-inline-form input, .add-inline-form .btn-add-inline { width: 100%; }

    /* 行程日历 */
    #calendarEl { padding: 8px; }
    #calendarEl .fc-toolbar { flex-direction: column; gap: 8px; }
    #calendarEl .fc-toolbar-title { font-size: 16px; }
    #calendarEl .fc-button { padding: 4px 8px; font-size: 12px; }
  }

  /* 分类管理面板 */
  .btn-manage-cat { background: var(--surface); border: 1px solid var(--border); color: var(--ink-muted); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: border-color .15s, color .15s; }
  .btn-manage-cat:hover, .btn-manage-cat.active { border-color: var(--gold); color: var(--gold); }
  .cat-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .cat-panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .cat-panel-header span { font-weight: 600; color: var(--ink); font-size: 14px; }
  .cat-card-list { display: flex; flex-direction: column; gap: 8px; }
  .cat-card { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: white; border: 1px solid var(--border); border-radius: 8px; }
  .cat-card-img { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
  .cat-card-no-img { width: 48px; height: 48px; border-radius: 6px; background: var(--bg); border: 1px dashed var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--ink-muted); font-size: 18px; }
  .cat-card-info { flex: 1; min-width: 0; }
  .cat-card-name { font-size: 14px; font-weight: 500; color: var(--ink); }
  .cat-card-desc { font-size: 12px; color: var(--ink-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cat-empty { color: var(--ink-muted); font-size: 13px; padding: 8px 0; }
</style>
</head>
<body>

<!-- 登录页 -->
<div id="loginPage">
  <div class="login-box">
    <h1>坐忘茗舍</h1>
    <p>请先在首页登录管理员账号</p>
    <a href="index.html" class="btn-primary" style="display:block;box-sizing:border-box;text-align:center;text-decoration:none">返回主页登录</a>
    <div class="error-msg" id="loginError"></div>
  </div>
</div>

<!-- 管理后台 -->
<div id="adminPage">
  <div class="top-bar">
    <div class="top-bar-title">坐忘茗舍 · 管理后台</div>
    <div class="top-bar-right">

<script>
const SUPABASE_URL = 'https://wmatsdnpbpcltuoynyrh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_gw7gfFtSHHJR6SbDUpCTwA_HNcktgEl';
const { createClient } = supabase;
// 登录状态存哪里由"记住密码"勾选框决定：勾了存 localStorage（关浏览器也不用重登），
// 不勾存 sessionStorage（关掉标签页/浏览器就清空，不会留在别人打开的同一台设备上）
const authStorage = {
  getItem: (key) => localStorage.getItem(key) ?? sessionStorage.getItem(key),
  setItem: (key, value) => {
    (localStorage.getItem('rememberLogin') === '1' ? localStorage : sessionStorage).setItem(key, value);
  },
  removeItem: (key) => {
    localStorage.removeItem(key);
    sessionStorage.removeItem(key);
  },
};
const db = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storage: authStorage } });

let currentTab = 'tea';
let currentFilter = null;
let editingId = null;
let detailImages = []; // [{ url } for saved images | { file, previewUrl } for pending uploads]
let pendingImageRemovals = [];

// 商品主图裁剪状态
let _prodCropScale = 1, _prodCropX = 0, _prodCropY = 0;
let _prodImgDirty = false; // 图片是否被新选择/拖动/缩放过，决定保存时是否要重新生成裁剪图
let _prodDragging = false;
let _prodDragStart = null;
const tabProductsCache = {}; // { tabKey: allProductsArray }
let categoriesCache = [];

const tabConfig = {
  tea:      { title: '精选茗茶', subtitle: '管理茶叶品牌与产品', type: 'tea' },
  teaware:  { title: '茶器美学', subtitle: '管理茶器分类与商品', type: 'teaware' },
  guqin:    { title: '斫琴甄选', subtitle: '管理古琴分类与商品', type: 'guqin' },
  qindao:   { title: '琴道传习', subtitle: '管理活动招生海报', type: 'poster', section: 'qindao' },
  yaji:     { title: '坐忘雅集', subtitle: '管理雅集活动海报', type: 'poster', section: 'yaji' },
  allmembers: { title: '全部客户资料', subtitle: '所有客户档案，含已注册与代建档', type: 'allmembers' },
  qinren:   { title: '琴人档案', subtitle: '管理学员课时套餐', type: 'member', memberType: 'class' },
  guests:   { title: '茗客档案', subtitle: '管理客人消费记录', type: 'member', memberType: 'purchase' },
  schedule: { title: '行程安排', subtitle: '管理主理人行程与学员约课时间', type: 'schedule' },
};

async function doLogout() {
  stopSessionWatch();
  await db.auth.signOut({ scope: 'local' });
  document.getElementById('adminPage').style.display = 'none';
  document.getElementById('loginPage').style.display = 'flex';
}

let sessionWatchTimer = null;
function startSessionWatch() {
  if (sessionWatchTimer) return;
  sessionWatchTimer = setInterval(async () => {
    const { data: { user } } = await db.auth.getUser();
    if (!user) {
      stopSessionWatch();
      await db.auth.signOut({ scope: 'local' });
      document.getElementById('adminPage').style.display = 'none';
      document.getElementById('loginPage').style.display = 'flex';
      document.getElementById('loginError').textContent = '此账号已在其他设备登录，本设备已自动退出';
    }
  }, 3 * 60 * 1000);
}
function stopSessionWatch() {
  if (sessionWatchTimer) { clearInterval(sessionWatchTimer); sessionWatchTimer = null; }
}

async function showAdmin() {
  const { data: { user } } = await db.auth.getUser();
  if (!user) { document.getElementById('loginPage').style.display = 'flex'; return; }
  const { data: profile } = await db.from('profiles').select('role').eq('id', user.id).maybeSingle();
  if (!profile || profile.role !== 'admin') {
    await db.auth.signOut({ scope: 'local' });
    document.getElementById('loginError').textContent = '此账号不是管理员';
    document.getElementById('adminPage').style.display = 'none';
    document.getElementById('loginPage').style.display = 'flex';
    return;
  }
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('adminPage').style.display = 'block';
  document.getElementById('userEmail').textContent = user.email;
  startSessionWatch();
  cleanupExpiredCodes();
  await loadCategories();
  await loadProducts();
}

// 密钥生成 3 天内没被用掉就自动清掉，免得越积越多。每次登录后台时顺手清一次
// （项目里没有后台定时任务，靠这个触发点做"自动"，不需要额外的服务器）
async function cleanupExpiredCodes() {
  const cutoff = new Date(Date.now() - 3 * 24 * 60 * 60 * 1000).toISOString();
  await db.from('invite_codes').delete().eq('is_used', false).lt('created_at', cutoff);
  await db.from('password_reset_codes').delete().eq('is_used', false).lt('created_at', cutoff);
}

// 分类
async function loadCategories() {
  const { data } = await db.from('categories').select('*').order('sort_order');
  categoriesCache = data || [];
}

function getCategoriesForTab() {
  return categoriesCache.filter(c => c.type === tabConfig[currentTab].type);
}

function renderFilterBar() {
  const cats = getCategoriesForTab();
  const bar = document.getElementById('filterBar');
  bar.innerHTML = cats.map(c =>
    `<button class="filter-chip ${currentFilter === c.key ? 'active' : ''}" onclick="setFilter('${c.key}')">${c.name}</button>`
  ).join('');
}

function setFilter(key) {
  currentFilter = currentFilter === key ? null : key;
  renderFilterBar();
  loadProducts();
}

// 商品 / 海报 / 会员 / 行程 统一加载入口
async function loadProducts(forceRefresh = false) {
  const cfg = tabConfig[currentTab];
  const hasCached = !!tabProductsCache[currentTab];
  if (!hasCached) document.getElementById('productList').innerHTML = '<div class="loading">加载中...</div>';
  document.getElementById('btnGenBlankKey').style.display = 'none';
  document.getElementById('blankCodesPanel').style.display = 'none';

  if (cfg.type === 'allmembers') {
    document.getElementById('btnAdd').style.display = 'none';
    document.getElementById('btnAddPoster').style.display = 'none';
    document.getElementById('catPanel').style.display = 'none';
    resetCatPanel();
    loadBlankCodes();
    const btnMember = document.getElementById('btnAddMember');
    btnMember.style.display = '';
    btnMember.textContent = '+ 新建客户档案';
    btnMember.onclick = () => openNewBlankMemberPrompt();
    document.getElementById('btnGenBlankKey').style.display = '';
    document.getElementById('filterBar').innerHTML = '<input type="text" class="member-search" id="memberSearch" placeholder="搜索姓名/备注昵称..." oninput="loadAllMembers()">';
    await loadAllMembers();
    return;
  }

  if (cfg.type === 'schedule') {
    document.getElementById('btnAdd').style.display = 'none';
    document.getElementById('btnAddPoster').style.display = 'none';
    document.getElementById('btnAddMember').style.display = 'none';
    document.getElementById('catPanel').style.display = 'none';
    resetCatPanel();
    document.getElementById('filterBar').innerHTML = '';
    document.getElementById('productList').innerHTML = '<div id="calendarEl"></div>';
    renderCalendar();
    return;
  }

  if (cfg.type === 'member') {
    document.getElementById('btnAdd').style.display = 'none';
    document.getElementById('btnAddPoster').style.display = 'none';
    document.getElementById('catPanel').style.display = 'none';
    resetCatPanel();
    const btnMember = document.getElementById('btnAddMember');
    btnMember.style.display = '';
    btnMember.textContent = cfg.memberType === 'class' ? '+ 添加课时套餐' : '+ 添加消费记录';
    btnMember.onclick = () => openAddRecordModal(cfg.memberType);
    document.getElementById('filterBar').innerHTML = '<input type="text" class="member-search" id="memberSearch" placeholder="搜索姓名..." oninput="loadMembers()">';
    await loadMembers();
    return;
  }

  if (cfg.type === 'poster') {
    document.getElementById('btnAdd').style.display = 'none';
    document.getElementById('btnAddPoster').style.display = '';
    document.getElementById('btnAddMember').style.display = 'none';
    document.getElementById('catPanel').style.display = 'none';
    resetCatPanel();
    document.getElementById('filterBar').innerHTML = '';
    let posters = tabProductsCache[currentTab];
    if (!posters || forceRefresh) {
      const { data } = await db.from('posters').select('*').eq('section', cfg.section).order('sort_order').order('created_at');
      posters = data || [];
      tabProductsCache[currentTab] = posters;
    }
    renderPosters(posters, cfg.section);
    return;
  }

  document.getElementById('catPanel').style.display = '';
  document.getElementById('btnAdd').style.display = '';
  document.getElementById('btnAddPoster').style.display = 'none';
  document.getElementById('btnAddMember').style.display = 'none';
  renderFilterBar();

  const cats = getCategoriesForTab().map(c => c.key);
  let allProducts = tabProductsCache[currentTab];
  if (!allProducts || forceRefresh) {
    const { data } = await db.from('products').select('*, categories(name)').in('category_key', cats.length ? cats : ['__none__']).order('is_visible', { ascending: false }).order('sort_order');
    allProducts = data || [];
    tabProductsCache[currentTab] = allProducts;
  } else {
    document.getElementById('productList').innerHTML = '';
  }
  const filtered = currentFilter ? allProducts.filter(p => p.category_key === currentFilter) : allProducts;
  renderProducts(filtered);
}

function productRowHtml(p, i = 0) {
  return `
    <div class="product-row" data-id="${p.id}" data-sort="${p.sort_order || i}" draggable="true">
      ${p.image_url ? `<img src="${p.image_url}" alt="${p.name}" onerror="this.style.display='none'">` : '<div class="no-img">无图</div>'}
      <div class="product-info">
        <div class="product-name">${p.name} ${!p.is_visible ? '<span class="badge-hidden">已隐藏</span>' : ''}</div>
        <div class="product-meta">${p.categories?.name || ''} ${p.price ? '· ' + p.price : ''}</div>
        ${p.description ? `<div class="product-meta" style="margin-top:2px">${p.description}</div>` : ''}
      </div>
      <div class="product-actions">
        <div class="sort-btns">
          <button class="sort-btn" onclick="moveProduct('${p.id}', -1)" title="上移">↑</button>
          <button class="sort-btn" onclick="moveProduct('${p.id}', 1)" title="下移">↓</button>
        </div>
        <div class="visibility-switch">
          <button class="vs-btn vs-btn-show ${p.is_visible ? 'vs-active-show' : ''}" onmousedown="event.preventDefault();setVisible('${p.id}', true)">显示</button><button class="vs-btn vs-btn-hide ${!p.is_visible ? 'vs-active-hide' : ''}" onmousedown="event.preventDefault();setVisible('${p.id}', false)">隐藏</button>
        </div>
        <button class="btn-edit" onclick="openEditModal('${p.id}')">编辑</button>
        <button class="btn-delete" onclick="deleteProduct('${p.id}', '${p.name.replace(/'/g, "\\'")}')">删除</button>
      </div>
    </div>
  `;
}

function renderProducts(products) {
  const el = document.getElementById('productList');
  if (!products.length) {
    el.innerHTML = '<div class="empty-state"><div style="font-size:32px">📦</div><p>暂无商品，点击「添加商品」开始</p></div>';
    return;
  }
  el.innerHTML = '<div class="product-list" id="sortableList">' + products.map(productRowHtml).join('') + '</div>';
  initDragSort();
}

function resetDetailImages() {

function renderDetailImgGrid() {

function handleDetailImagesSelect(event) {

function removeDetailImage(index) {
  const item = detailImages[index];
  if (!item) return;
  if (item.url) pendingImageRemovals.push(item.url);
  if (item.file) URL.revokeObjectURL(item.previewUrl);
  detailImages.splice(index, 1);
  renderDetailImgGrid();
}

// 图片压缩
function compressImage(file, maxW = 1200, quality = 0.82) {
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.width, h = img.height;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(blob => resolve(blob), 'image/jpeg', quality);
    };
    img.src = url;
  });
}

function handleImageSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  loadProductCropImage(URL.createObjectURL(file));
  _prodImgDirty = true;
  document.getElementById('uploadStatus').textContent = '拖动图片调整位置，滚轮或拖动滑块缩放';
}

// 把图片载入裁剪框：按 4:3 铺满显示（不留白），默认居中，可再拖动/缩放调整
function loadProductCropImage(url) {
  const img = document.getElementById('uploadPreview');
  const frame = document.getElementById('uploadArea');
  const zoom = document.getElementById('uploadZoom');
  const placeholder = document.getElementById('uploadPlaceholder');
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    const fw = frame.clientWidth, fh = frame.clientHeight;
    const fitScale = Math.max(fw / img.naturalWidth, fh / img.naturalHeight);
    _prodCropScale = fitScale;
    _prodCropX = (fw - img.naturalWidth * fitScale) / 2;
    _prodCropY = (fh - img.naturalHeight * fitScale) / 2;
    zoom.min = fitScale;
    zoom.max = fitScale * 4;
    zoom.step = fitScale * 0.01;
    zoom.value = fitScale;
    applyProductCropTransform();
    img.style.display = 'block';
    placeholder.style.display = 'none';
    document.getElementById('uploadCropControls').style.display = 'flex';
    frame.classList.add('has-image');
  };
  img.src = url;
}

function applyProductCropTransform() {
  const img = document.getElementById('uploadPreview');
  const frame = document.getElementById('uploadArea');
  if (!img.naturalWidth) return;
  const fw = frame.clientWidth, fh = frame.clientHeight;
  const iw = img.naturalWidth * _prodCropScale, ih = img.naturalHeight * _prodCropScale;
  _prodCropX = Math.min(0, Math.max(fw - iw, _prodCropX));
  _prodCropY = Math.min(0, Math.max(fh - ih, _prodCropY));
  img.style.width = iw + 'px';
  img.style.height = ih + 'px';
  img.style.left = _prodCropX + 'px';
  img.style.top = _prodCropY + 'px';
}

function resetProductCropState() {
  _prodCropScale = 1; _prodCropX = 0; _prodCropY = 0; _prodImgDirty = false;
  document.getElementById('uploadArea').classList.remove('has-image');
  document.getElementById('uploadCropControls').style.display = 'none';
}

// 把裁剪框当前显示的内容烘焙成一张 4:3 的图
async function bakeProductCrop() {
  const img = document.getElementById('uploadPreview');
  const frame = document.getElementById('uploadArea');
  const fw = frame.clientWidth, fh = frame.clientHeight;
  const outW = 1200, outH = Math.round(outW * fh / fw);
  const canvas = document.createElement('canvas');
  canvas.width = outW; canvas.height = outH;
  const ctx = canvas.getContext('2d');
  ctx.save();
  ctx.scale(outW / fw, outH / fh);
  ctx.translate(_prodCropX, _prodCropY);
  ctx.scale(_prodCropScale, _prodCropScale);
  ctx.drawImage(img, 0, 0);
  ctx.restore();
  return new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.82));
}

// 详情图快照上传：只处理还没有 url（新选的）的项，已有 url 的原样返回
async function uploadDetailImagesFromSnapshot(snapshot) {
  const urls = [];
  const uploadedUrls = [];
  for (const item of snapshot) {
    if (item.url) { urls.push(item.url); continue; }
    const compressed = await compressImage(item.file);
    const filename = `${Date.now()}-${Math.random().toString(36).slice(2)}.jpg`;
    const { error } = await db.storage.from('product-images').upload(filename, compressed, { contentType: 'image/jpeg' });
    if (error) continue;
    const { data: { publicUrl } } = db.storage.from('product-images').getPublicUrl(filename);
    urls.push(publicUrl);
    uploadedUrls.push(publicUrl);
  }
  return { urls, uploadedUrls };
}

// 保存商品：界面立刻乐观更新+关闭弹窗，图片上传和数据库写入放到后台去做，
// 不让用户等网络（跟显示/隐藏切换的丝滑原则一致）。失败了再提示并把界面改回去。
async function saveProduct() {
  const name = document.getElementById('modalName').value.trim();
  if (!name) { showToast('请填写商品名称'); return; }

  const wasEditingId = editingId;
  const catKey = document.getElementById('modalCategory').value;
  const catName = categoriesCache.find(c => c.key === catKey)?.name || '';
  const basePayload = {
    category_key: catKey,
    name,
    description: document.getElementById('modalDesc').value.trim() || null,
    price: document.getElementById('modalPrice').value.trim() || null,
  };
  if (!wasEditingId) basePayload.is_visible = true;

  // 主图：本地烘焙（纯 canvas，很快），生成本地预览 URL 立刻展示；真正上传放到后台
  const oldImageUrl = document.getElementById('modalImage').value || null;
  const imgEl = document.getElementById('uploadPreview');
  const hasImage = imgEl.style.display !== 'none' && !!imgEl.src;
  let bakedBlob = null, optimisticImageUrl = null;
  if (hasImage && _prodImgDirty) {
    bakedBlob = await bakeProductCrop();
    optimisticImageUrl = URL.createObjectURL(bakedBlob);
  } else if (hasImage) {
    optimisticImageUrl = oldImageUrl;
  }

  // 详情图：拍个快照，真正上传也放到后台
  const detailSnapshot = detailImages.map(item => ({ ...item }));
  const detailRemovals = pendingImageRemovals.slice();
  const optimisticDetailUrls = detailSnapshot.filter(item => item.url).map(item => item.url);

  const optimisticPayload = { ...basePayload, image_url: optimisticImageUrl, detail_images: optimisticDetailUrls };
  const cache = tabProductsCache[currentTab];
  closeModal();

  let rowId = wasEditingId;
  let originalCachedSnapshot = null;
  if (wasEditingId) {
    const cached = cache?.find(p => p.id === wasEditingId);
    if (cached) {
      originalCachedSnapshot = { ...cached };
      Object.assign(cached, optimisticPayload, { categories: { name: catName } });
    }
    const row = document.querySelector(`.product-row[data-id="${wasEditingId}"]`);
    const stillMatchesFilter = !currentFilter || currentFilter === catKey;
    if (row) {
      if (stillMatchesFilter) row.outerHTML = productRowHtml(cached || { ...optimisticPayload, id: wasEditingId });
      else { row.remove(); refreshEmptyStateIfNeeded(); }
    }
  } else {
    rowId = 'temp_' + Date.now();
    const tempProduct = { ...optimisticPayload, id: rowId, categories: { name: catName }, sort_order: 0 };
    if (cache) cache.unshift(tempProduct);
    if (!currentFilter || currentFilter === catKey) {
      const list = document.getElementById('sortableList');
      if (list) { list.insertAdjacentHTML('afterbegin', productRowHtml(tempProduct)); initDragSort(); }
      else { renderProducts([tempProduct]); }
    }
  }

  // 后台：真正上传 + 写数据库
  (async () => {
    const uploadedUrls = [];
    try {
      let finalImageUrl = optimisticImageUrl;
      if (bakedBlob) {
        const filename = `${Date.now()}-${Math.random().toString(36).slice(2)}.jpg`;
        const { error } = await db.storage.from('product-images').upload(filename, bakedBlob, { contentType: 'image/jpeg' });
        if (error) throw error;
        finalImageUrl = db.storage.from('product-images').getPublicUrl(filename).data.publicUrl;
        uploadedUrls.push(finalImageUrl);
      }
      const { urls: finalDetailUrls, uploadedUrls: detailUploaded } = await uploadDetailImagesFromSnapshot(detailSnapshot);
      uploadedUrls.push(...detailUploaded);

      const finalPayload = { ...basePayload, image_url: finalImageUrl, detail_images: finalDetailUrls };
      let error, insertedRow;
      if (wasEditingId) {
        ({ error } = await db.from('products').update(finalPayload).eq('id', wasEditingId));
      } else {
        ({ data: insertedRow, error } = await db.from('products').insert(finalPayload).select().single());
      }
      if (error) throw error;

      showToast(wasEditingId ? '商品已更新' : '商品已添加');

      const toRemove = [];
      if (bakedBlob && oldImageUrl) toRemove.push(oldImageUrl);
      toRemove.push(...detailRemovals);
      const removePaths = toRemove.map(storagePathFromUrl).filter(Boolean);
      if (removePaths.length) db.storage.from('product-images').remove(removePaths);

      // 换成正式链接前先在背后把图片预加载/解码好，真正切换时浏览器直接用缓存，不会看到"慢慢加载"
      if (bakedBlob) {
        await new Promise(resolve => {
          const preloadImg = new Image();
          preloadImg.onload = resolve;
          preloadImg.onerror = resolve;
          preloadImg.src = finalImageUrl;
        });
      }

      const realId = wasEditingId || insertedRow.id;
      const cachedNow = tabProductsCache[currentTab]?.find(p => p.id === rowId);
      if (cachedNow) {
        cachedNow.id = realId;
        cachedNow.image_url = finalImageUrl;
        cachedNow.detail_images = finalDetailUrls;
        if (insertedRow) { cachedNow.sort_order = insertedRow.sort_order; cachedNow.created_at = insertedRow.created_at; }
      }
      const rowEl = document.querySelector(`.product-row[data-id="${rowId}"]`);
      if (rowEl && cachedNow) rowEl.outerHTML = productRowHtml(cachedNow);
      if (bakedBlob) URL.revokeObjectURL(optimisticImageUrl);
    } catch (err) {
      showToast('保存失败：' + (err?.message || '网络错误'));
      if (uploadedUrls.length) db.storage.from('product-images').remove(uploadedUrls.map(storagePathFromUrl).filter(Boolean));
      if (bakedBlob) URL.revokeObjectURL(optimisticImageUrl);
      if (wasEditingId) {
        const cached = tabProductsCache[currentTab]?.find(p => p.id === wasEditingId);
        if (cached && originalCachedSnapshot) Object.assign(cached, originalCachedSnapshot);
        const rowEl = document.querySelector(`.product-row[data-id="${wasEditingId}"]`);
        if (rowEl && cached) rowEl.outerHTML = productRowHtml(cached);
        else loadProducts(true);
      } else {
        const cache2 = tabProductsCache[currentTab];
        if (cache2) { const idx = cache2.findIndex(p => p.id === rowId); if (idx > -1) cache2.splice(idx, 1); }
        document.querySelector(`.product-row[data-id="${rowId}"]`)?.remove();
        refreshEmptyStateIfNeeded();
      }
    }
  })();
}

function refreshEmptyStateIfNeeded() {
  const list = document.getElementById('sortableList');
  if (list && !list.children.length) {
    document.getElementById('productList').innerHTML = '<div class="empty-state"><div style="font-size:32px">📦</div><p>暂无商品，点击「添加商品」开始</p></div>';
  }
}

function setVisible(id, visible) {
  const list = document.getElementById('sortableList');
  const row = document.querySelector(`.product-row[data-id="${id}"]`);
  if (!row) return;

  // 更新按钮和徽标
  const showBtn = row.querySelector('.vs-btn-show');
  const hideBtn = row.querySelector('.vs-btn-hide');
  const badge = row.querySelector('.badge-hidden');
  if (visible) {
    showBtn.classList.add('vs-active-show');
    hideBtn.classList.remove('vs-active-hide');
    if (badge) badge.remove();
  } else {
    showBtn.classList.remove('vs-active-show');
    hideBtn.classList.add('vs-active-hide');
    if (!badge) {
      row.querySelector('.product-name').insertAdjacentHTML('beforeend', '<span class="badge-hidden">已隐藏</span>');
    }
  }

  // 移动行位置：隐藏移到最底部，显示移到第一个隐藏行之前
  if (list) {
    if (!visible) {
      list.appendChild(row);
    } else {
      const firstHidden = [...list.querySelectorAll('.product-row')].find(r => r.querySelector('.badge-hidden'));
      if (firstHidden) list.insertBefore(row, firstHidden);
    }
  }

  // 后台保存：可见性 + 重新计算所有行的 sort_order
  const rows = list ? [...list.querySelectorAll('.product-row')] : [];
  const saves = [db.from('products').update({ is_visible: visible }).eq('id', id)];
  rows.forEach((r, i) => { r.dataset.sort = i; saves.push(db.from('products').update({ sort_order: i }).eq('id', r.dataset.id)); });
  Promise.all(saves).then(results => {
    if (results[0].error) setVisible(id, !visible);
    else delete tabProductsCache[currentTab];
  });
}

async function moveProduct(id, direction) {
  const list = document.getElementById('sortableList');
  const rows = [...list.querySelectorAll('.product-row')];
  const idx = rows.findIndex(r => r.dataset.id === id);
  const targetIdx = idx + direction;
  if (targetIdx < 0 || targetIdx >= rows.length) return;

  const rowA = rows[idx];
  const rowB = rows[targetIdx];

  // 动画：先记录各自位置
  const rectA = rowA.getBoundingClientRect();
  const rectB = rowB.getBoundingClientRect();
  const diffA = rectB.top - rectA.top;
  const diffB = rectA.top - rectB.top;

  // DOM 交换
  if (direction === -1) {
    list.insertBefore(rowA, rowB);
  } else {
    list.insertBefore(rowB, rowA);
  }

  // 交换 data-sort
  const sortA = rowA.dataset.sort;
  const sortB = rowB.dataset.sort;
  rowA.dataset.sort = sortB;
  rowB.dataset.sort = sortA;

  // FLIP 动画
  rowA.style.transition = 'none';
  rowB.style.transition = 'none';
  rowA.style.transform = `translateY(${-diffA}px)`;
  rowB.style.transform = `translateY(${-diffB}px)`;
  rowA.offsetHeight; // force reflow
  rowA.style.transition = 'transform 0.25s ease';
  rowB.style.transition = 'transform 0.25s ease';
  rowA.style.transform = '';
  rowB.style.transform = '';

  // 后台保存
  await Promise.all([
    db.from('products').update({ sort_order: parseInt(sortB) }).eq('id', rowA.dataset.id),
    db.from('products').update({ sort_order: parseInt(sortA) }).eq('id', rowB.dataset.id),
  ]);
}

function initDragSort() {
  const list = document.getElementById('sortableList');
  if (!list || list.dataset.dragBound) return;
  list.dataset.dragBound = '1';
  let dragging = null;

  list.addEventListener('dragstart', e => {
    dragging = e.target.closest('.product-row');
    if (!dragging) return;
    setTimeout(() => { dragging.style.opacity = '0.4'; }, 0);
  });

  list.addEventListener('dragend', async e => {
    const el = dragging;
    dragging = null;
    if (!el) return;
    el.style.opacity = '';
    el.style.transition = '';
    const rows = [...list.querySelectorAll('.product-row')];
    await Promise.all(rows.map((r, i) => {
      r.dataset.sort = i;
      return db.from('products').update({ sort_order: i }).eq('id', r.dataset.id);
    }));
  });

  // 兜底：任何情况松手都还原透明度
  document.addEventListener('mouseup', () => {
    document.querySelectorAll('.product-row').forEach(r => r.style.opacity = '');
  });

  list.addEventListener('dragover', e => {
    e.preventDefault();
    if (!dragging) return;
    const target = e.target.closest('.product-row');
    if (!target || target === dragging) return;
    const rect = target.getBoundingClientRect();
    const mid = rect.top + rect.height / 2;
    if (e.clientY < mid) {
      list.insertBefore(dragging, target);
    } else {
      list.insertBefore(dragging, target.nextSibling);
    }
  });
}

function storagePathFromUrl(url) {
  if (!url) return null;
  const marker = '/product-images/';
  const idx = url.indexOf(marker);
  if (idx === -1) return null;
  return decodeURIComponent(url.slice(idx + marker.length));
}

async function deleteProduct(id, name) {
  if (!confirm(`确定要删除「${name}」吗？`)) return;
  const { data } = await db.from('products').select('image_url, detail_images').eq('id', id).single();
  const { error } = await db.from('products').delete().eq('id', id);
  if (error) { showToast('删除失败：' + error.message); return; }
  const paths = [data?.image_url, ...(data?.detail_images || [])].map(storagePathFromUrl).filter(Boolean);
  if (paths.length) await db.storage.from('product-images').remove(paths);
  showToast('已删除');
  delete tabProductsCache[currentTab];
  loadProducts();
}

// ── 海报管理 ──────────────────────────────────────────

function renderPosters(posters, section) {
  const el = document.getElementById('productList');
  if (!posters.length) {
    el.innerHTML = '<div class="empty-state"><div style="font-size:32px">🖼️</div><p>暂无海报，点击「上传海报」添加</p></div>';
    return;
  }
  el.innerHTML = '<div class="poster-admin-grid" id="posterSortGrid">' + posters.map((p, i) => `
    <div class="poster-admin-card" data-id="${p.id}" data-sort="${p.sort_order ?? i}" draggable="true">
      <div class="poster-admin-img" style="background-image:url('${p.image_url}')"></div>
      ${p.title ? `<div class="poster-admin-title">${p.title}</div>` : ''}
      <div class="poster-admin-vis" data-id="${p.id}">

      </div>
      <div class="poster-admin-actions">
        <div class="poster-sort-col">
          <button class="sort-btn" onclick="movePoster('${p.id}', -1)">↑</button>
          <button class="sort-btn" onclick="movePoster('${p.id}', 1)">↓</button>

        <button class="btn-edit" onclick="openPosterEdit('${p.id}','${(p.title||'').replace(/'/g,"\\'")}','${p.image_url}')">编辑</button>
        <button class="btn-delete" onclick="deletePoster('${p.id}')">删除</button>
      </div>
    </div>
  `).join('') + '</div>';

}

function initPosterDragSort() {
  const grid = document.getElementById('posterSortGrid');
  if (!grid) return;
  let dragging = null;
  grid.addEventListener('dragstart', e => {
    dragging = e.target.closest('.poster-admin-card');
    if (!dragging) return;
    setTimeout(() => { dragging.style.opacity = '0.4'; }, 0);
  });
  grid.addEventListener('dragend', async () => {
    const el = dragging; dragging = null;
    if (!el) return;
    el.style.opacity = '';
    const cards = [...grid.querySelectorAll('.poster-admin-card')];
    await Promise.all(cards.map((c, i) => {
      c.dataset.sort = i;
      return db.from('posters').update({ sort_order: i }).eq('id', c.dataset.id);
    }));
  });
  document.addEventListener('mouseup', () => {
    grid.querySelectorAll('.poster-admin-card').forEach(c => c.style.opacity = '');
  });
  grid.addEventListener('dragover', e => {
    e.preventDefault();
    if (!dragging) return;
    const target = e.target.closest('.poster-admin-card');
    if (!target || target === dragging) return;
    const rect = target.getBoundingClientRect();
    if (e.clientX < rect.left + rect.width / 2) grid.insertBefore(dragging, target);
    else grid.insertBefore(dragging, target.nextSibling);
  });
}

function openPosterUpload() {
  const section = tabConfig[currentTab].section;
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    showToast('上传中…');
    // 压缩到 3:4
    const blob = await cropAndCompress(file, 3, 4);
    const filename = `poster_${section}_${Date.now()}.jpg`;
    const { error: upErr } = await db.storage.from('product-images').upload(filename, blob, { contentType: 'image/jpeg' });
    if (upErr) { showToast('上传失败'); return; }
    const { data: { publicUrl } } = db.storage.from('product-images').getPublicUrl(filename);
    const { error: insErr } = await db.from('posters').insert({ section, image_url: publicUrl, sort_order: 999 });
    if (insErr) { showToast('保存失败：' + insErr.message); db.storage.from('product-images').remove([filename]); return; }
    showToast('海报已上传');
    delete tabProductsCache[currentTab];
    loadProducts();
  };
  input.click();
}

async function cropAndCompress(file, ratioW, ratioH) {
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const srcW = img.width, srcH = img.height;
      let cropW = srcW, cropH = Math.round(srcW * ratioH / ratioW);
      if (cropH > srcH) { cropH = srcH; cropW = Math.round(srcH * ratioW / ratioH); }
      const offX = Math.round((srcW - cropW) / 2);
      const offY = Math.round((srcH - cropH) / 2);
      const maxH = 1440;
      const scale = cropH > maxH ? maxH / cropH : 1;
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(cropW * scale);
      canvas.height = Math.round(cropH * scale);
      canvas.getContext('2d').drawImage(img, offX, offY, cropW, cropH, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.85);
    };
    img.src = url;
  });
}

function setVisiblePoster(id, visible) {
  const grid = document.getElementById('posterSortGrid');
  const card = document.querySelector(`.poster-admin-card[data-id="${id}"]`);
  if (!card) return;
  const showBtn = card.querySelector('.vs-btn-show');
  const hideBtn = card.querySelector('.vs-btn-hide');
  const img = card.querySelector('.poster-admin-img');
  if (visible) {
    showBtn.classList.add('vs-active-show');
    hideBtn.classList.remove('vs-active-hide');
    img.classList.remove('is-hidden');
  } else {
    showBtn.classList.remove('vs-active-show');
    hideBtn.classList.add('vs-active-hide');
    img.classList.add('is-hidden');
  }
  // 隐藏的沉到底部，显示的浮到最前
  if (grid) {
    if (!visible) {
      grid.appendChild(card);
    } else {
      const firstHidden = [...grid.querySelectorAll('.poster-admin-card')].find(c => c.querySelector('.poster-admin-img.is-hidden'));
      if (firstHidden) grid.insertBefore(card, firstHidden);
    }
  }
  const cards = grid ? [...grid.querySelectorAll('.poster-admin-card')] : [];
  const saves = [db.from('posters').update({ is_visible: visible }).eq('id', id)];
  cards.forEach((c, i) => { c.dataset.sort = i; saves.push(db.from('posters').update({ sort_order: i }).eq('id', c.dataset.id)); });
  Promise.all(saves).then(results => {
    if (results[0].error) setVisiblePoster(id, !visible);
  });
}

async function deletePoster(id) {
  if (!confirm('确定删除这张海报吗？')) return;
  const { data } = await db.from('posters').select('image_url').eq('id', id).single();
  const { error } = await db.from('posters').delete().eq('id', id);
  if (error) { showToast('删除失败：' + error.message); return; }
  const path = storagePathFromUrl(data?.image_url);
  if (path) await db.storage.from('product-images').remove([path]);
  showToast('已删除');
  delete tabProductsCache[currentTab];
  loadProducts();
}

async function movePoster(id, direction) {
  const cards = [...document.querySelectorAll('.poster-admin-card')];
  const idx = cards.findIndex(c => c.dataset.id === id);
  const targetIdx = idx + direction;
  if (targetIdx < 0 || targetIdx >= cards.length) return;
  const grid = cards[idx].parentNode;
  if (direction === -1) grid.insertBefore(cards[idx], cards[targetIdx]);
  else grid.insertBefore(cards[targetIdx], cards[idx]);
  const allCards = [...grid.querySelectorAll('.poster-admin-card')];
  await Promise.all(allCards.map((c, i) => db.from('posters').update({ sort_order: i }).eq('id', c.dataset.id)));
}

// 会员列表：琴人档案只显示有课时套餐的人，茗客档案只显示有消费记录的人
async function loadMembers(forceRefresh = false) {
  const cfg = tabConfig[currentTab];
  const memberType = cfg.memberType;
  const search = document.getElementById('memberSearch');
  const keyword = (search ? search.value.trim() : '').toLowerCase();

  let rawData = tabProductsCache[currentTab];
  if (!rawData || forceRefresh) {
    // 课时套餐/消费记录表跟 members 表分开单独查，再在前端拼起来——RLS 开了之后
    // 用内嵌语法一次查（members(...) 写在 select 里）会莫名把行漏掉，拆成两条
    // 独立查询规避这个问题，两边各自的管理员权限都是确认有效的。
    const [{ data: records, error: recordsErr }, { data: members, error: membersErr }] = await Promise.all([
      memberType === 'class'
        ? db.from('class_packages').select('member_id, total_hours, used_hours').order('created_at')
        : db.from('purchases').select('member_id, amount').order('purchased_at', { ascending: false }),
      db.from('members').select('id, name, nickname, phone'),
    ]);
    if (recordsErr || membersErr) {
      showToast('加载失败：' + ((recordsErr || membersErr).message || '未知错误'));
      console.error('loadMembers error', recordsErr, membersErr);
    }
    const memberMap = new Map((members || []).map(m => [m.id, m]));
    rawData = (records || []).map(r => ({ ...r, members: memberMap.get(r.member_id) || null }));
    tabProductsCache[currentTab] = rawData;
  }

  const map = new Map();
  if (memberType === 'class') {
    rawData.forEach(r => {
      if (!r.members) return;
      if (!map.has(r.member_id)) map.set(r.member_id, { id: r.member_id, name: r.members.name, nickname: r.members.nickname, phone: r.members.phone, remaining: 0, packages: 0 });
      const entry = map.get(r.member_id);
      entry.remaining += (r.total_hours - r.used_hours);
      entry.packages += 1;
    });
  } else {
    rawData.forEach(r => {
      if (!r.members) return;
      if (!map.has(r.member_id)) map.set(r.member_id, { id: r.member_id, name: r.members.name, nickname: r.members.nickname, phone: r.members.phone, total: 0, count: 0 });
      const entry = map.get(r.member_id);
      entry.total += Number(r.amount) || 0;
      entry.count += 1;
    });
  }
  let list = [...map.values()];
  if (keyword) list = list.filter(m => displayMemberName(m).toLowerCase().includes(keyword));
  renderMemberList(list, memberType);
}

async function loadAllMembers(forceRefresh = false) {
  const search = document.getElementById('memberSearch');
  const keyword = (search ? search.value.trim() : '').toLowerCase();

  let cache = tabProductsCache['allmembers'];
  if (!cache || forceRefresh) {
    const [{ data: members }, { data: profiles }] = await Promise.all([
      db.from('members').select('*').order('created_at', { ascending: false }),
      db.from('profiles').select('member_id').eq('role', 'member'),

// 会员登录密钥：字符集去掉了容易看错/念错的 0/O/1/I，方便当面口述或手写给客人
function genInviteCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const arr = new Uint8Array(8);
  crypto.getRandomValues(arr);
  let code = '';
  for (let i = 0; i < 8; i++) code += chars[arr[i] % chars.length];
  return code;
}

async function loadInviteCodeStatus() {
  if (!currentMemberId) return;
  const infoEl = document.getElementById('memberAccountInfo');
  const codeEl = document.getElementById('inviteCodeStatus');

  const { data: profile } = await db.from('profiles').select('login_account').eq('member_id', currentMemberId).eq('role', 'member').maybeSingle();
  infoEl.textContent = profile ? `登录账号（邮箱/手机号）：${profile.login_account || '（未记录）'}` : '尚未注册会员账号';

  const [{ data: invites }, { data: resets }] = await Promise.all([
    db.from('invite_codes').select('*').eq('member_id', currentMemberId).order('created_at', { ascending: false }),
    db.from('password_reset_codes').select('*').eq('member_id', currentMemberId).order('created_at', { ascending: false }),
  ]);

  const inviteLines = (invites || []).map(c => codeLineHtml(c, 'invite', c.is_used ? '已使用的注册密钥' : '注册密钥（未使用）'));
  const resetLines = (resets || []).map(c => codeLineHtml(c, 'reset', c.is_used ? '已使用的重置密钥' : '密码重置密钥（未使用）'));
  const lines = [...inviteLines, ...resetLines];
  codeEl.innerHTML = lines.length ? lines.join('') : '尚未生成过密钥';
}

function codeLineHtml(c, kind, label) {
  return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
    <span>${label}：<strong>${c.code}</strong></span>
    <button class="btn-mini-delete" onclick="deleteCode('${kind}', '${c.id}')">删除</button>
  </div>`;
}

async function deleteCode(kind, id) {
  const table = kind === 'invite' ? 'invite_codes' : 'password_reset_codes';
  await db.from(table).delete().eq('id', id);

let calendarInstance = null;

function formatSlotLabel(date) {
  const h = date.getHours();
  const m = date.getMinutes();
  const period = h < 12 ? '上午' : '下午';
  let h12 = h % 12;
  if (h12 === 0) h12 = 12;
  return m === 0 ? `${period}${h12}点` : `${period}${h12}点${m}分`;
}

async function renderCalendar(forceRefresh = false) {
  let events = tabProductsCache['schedule'];
  if (!events || forceRefresh) {
    // 跟会员列表同理，跟 members 分开查再前端拼，避免内嵌 join 在 RLS 开启后漏数据
    const [{ data: rows }, { data: members }] = await Promise.all([
      db.from('schedule_events').select('*').order('start_at'),
      db.from('members').select('id, name, nickname'),
    ]);
    const memberMap = new Map((members || []).map(m => [m.id, m]));
    events = (rows || []).map(e => {
      const m = memberMap.get(e.member_id);
      const label = m ? (m.nickname || m.name) : null;
      return { id: e.id, title: label ? `${label} · ${e.title}` : e.title, start: e.start_at, end: e.end_at };
    });
    tabProductsCache['schedule'] = events;
  }

  const el = document.getElementById('calendarEl');
  if (!el) return;
  if (calendarInstance) { calendarInstance.destroy(); calendarInstance = null; }
  calendarInstance = new FullCalendar.Calendar(el, {
    locale: 'zh-cn',
    height: 'auto',
    headerToolbar: { left: 'prev,next today', center: 'title', right: 'multiMonthYear,dayGridMonth,timeGridWeek,timeGridDay' },
    buttonText: { today: '今天', multiMonthYear: '年', dayGridMonth: '月', timeGridWeek: '周', timeGridDay: '日', list: '列表' },
    allDayText: '全天',
    slotLabelContent: (arg) => formatSlotLabel(arg.date),
    initialView: 'dayGridMonth',
    events,
    selectable: true,
    select: (info) => { openAddEventModal(null, info.start, info.end); calendarInstance.unselect(); },
    eventClick: (info) => openEditEventModal(info.event.id),
  });
  calendarInstance.render();
}

function toDatetimeLocal(dateOrStr) {
  const d = dateOrStr instanceof Date ? dateOrStr : new Date(dateOrStr);

}

// 图片上传区：支持从文件夹拖拽图片进来
function enableDropUpload(areaEl, inputEl, multiple) {
  if (!areaEl || !inputEl) return;
  ['dragenter', 'dragover'].forEach(evt => areaEl.addEventListener(evt, e => {
    e.preventDefault();
    areaEl.classList.add('drag-over');
  }));
  ['dragleave', 'drop'].forEach(evt => areaEl.addEventListener(evt, () => {
    areaEl.classList.remove('drag-over');
  }));
  areaEl.addEventListener('drop', e => {
    e.preventDefault();
    const dropped = Array.from(e.dataTransfer?.files || []).filter(f => f.type.startsWith('image/'));
    if (!dropped.length) return;
    const files = multiple ? dropped : [dropped[0]];
    const dt = new DataTransfer();
    files.forEach(f => dt.items.add(f));
    inputEl.files = dt.files;
    inputEl.dispatchEvent(new Event('change'));
  });
}
// 防止拖拽脱靶时浏览器直接打开图片文件
window.addEventListener('dragover', e => e.preventDefault());

document.addEventListener('DOMContentLoaded', () => {
  enableDropUpload(document.getElementById('uploadArea'), document.getElementById('imageFileInput'), false);
  enableDropUpload(document.getElementById('detailUploadArea'), document.getElementById('detailImageFileInput'), true);
  enableDropUpload(document.getElementById('catUploadArea'), document.getElementById('catImageInput'), false);

  // 商品主图裁剪框：拖动改位置、滚轮/滑块缩放
  const cropFrame = document.getElementById('uploadArea');
  const cropZoom = document.getElementById('uploadZoom');

  cropZoom.addEventListener('input', function() {
    _prodCropScale = parseFloat(this.value);
    applyProductCropTransform();
    _prodImgDirty = true;
  });

  cropFrame.addEventListener('wheel', e => {
    if (!cropFrame.classList.contains('has-image')) return;
    e.preventDefault();
    const delta = e.deltaY > 0 ? -0.05 : 0.05;
    _prodCropScale = Math.max(parseFloat(cropZoom.min), Math.min(parseFloat(cropZoom.max), _prodCropScale + delta * _prodCropScale));
    cropZoom.value = _prodCropScale;
    applyProductCropTransform();
    _prodImgDirty = true;
  }, { passive: false });

  cropFrame.addEventListener('pointerdown', e => {
    if (!cropFrame.classList.contains('has-image')) return;
    e.preventDefault();
    _prodDragging = true;
    _prodDragStart = { x: e.clientX, y: e.clientY, cropX: _prodCropX, cropY: _prodCropY };
    cropFrame.classList.add('dragging');
    cropFrame.setPointerCapture(e.pointerId);
  });
  cropFrame.addEventListener('pointermove', e => {
    if (!_prodDragging) return;
    _prodCropX = _prodDragStart.cropX + (e.clientX - _prodDragStart.x);
    _prodCropY = _prodDragStart.cropY + (e.clientY - _prodDragStart.y);
    applyProductCropTransform();
  });
  const endProductDrag = () => {
    if (!_prodDragging) return;
    _prodDragging = false;
    cropFrame.classList.remove('dragging');
    _prodImgDirty = true;
  };
  cropFrame.addEventListener('pointerup', endProductDrag);
  cropFrame.addEventListener('pointercancel', endProductDrag);
});

let _posterEditId = null;
let _posterOrigUrl = null;
let _posterNewBlob = null;
let _cropScale = 1, _cropX = 0, _cropY = 0;
let _posterDragStart = null;

function openPosterEdit(id, title, imageUrl) {
  _posterEditId = id;
  _posterOrigUrl = imageUrl;
  _posterNewBlob = null;
  document.getElementById('posterEditTitle').value = title;
  const ov = document.getElementById('posterEditOverlay');

function loadCropImage(url) {
  const img = document.getElementById('posterCropImg');
  const frame = document.getElementById('posterCropFrame');
  const zoom = document.getElementById('posterZoom');
  _cropScale = 1;
  img.onload = () => {
    const fw = frame.clientWidth, fh = frame.clientHeight;
    const fitScale = Math.max(fw / img.naturalWidth, fh / img.naturalHeight);
    _cropScale = fitScale;
    zoom.min = fitScale * 0.5;
    zoom.max = fitScale * 4;
    zoom.step = fitScale * 0.01;
    zoom.value = fitScale;
    applyTransform();
  };
  img.src = url;
}

function applyTransform() {
  const img = document.getElementById('posterCropImg');
  const frame = document.getElementById('posterCropFrame');
  const fw = frame.clientWidth, fh = frame.clientHeight;
  const iw = img.naturalWidth * _cropScale, ih = img.naturalHeight * _cropScale;
  img.style.left = ((fw - iw) / 2) + 'px';
  img.style.top = ((fh - ih) / 2) + 'px';
  img.style.width = iw + 'px';
  img.style.height = ih + 'px';
  img.style.transform = '';
}

function closePosterEdit() {
  document.getElementById('posterEditOverlay').style.display = 'none';
  _posterEditId = null; _posterNewBlob = null;
}

async function savePosterEdit() {
  if (!_posterEditId) return;
  const title = document.getElementById('posterEditTitle').value.trim();
  showToast('保存中…');
  let imageUrl = _posterOrigUrl;
  const oldUrl = _posterOrigUrl;
  let replaced = false;
  if (_posterNewBlob) {
    const frame = document.getElementById('posterCropFrame');
    const img = document.getElementById('posterCropImg');
    const fw = frame.clientWidth, fh = frame.clientHeight;
    const outW = 1080, outH = 1620;
    const canvas = document.createElement('canvas');
    canvas.width = outW; canvas.height = outH;
    const ctx = canvas.getContext('2d');
    const iw = img.naturalWidth * _cropScale, ih = img.naturalHeight * _cropScale;
    const offsetX = (fw - iw) / 2, offsetY = (fh - ih) / 2;
    const sx = outW / fw, sy = outH / fh;
    ctx.save();
    ctx.scale(sx, sy);
    ctx.translate(offsetX, offsetY);
    ctx.scale(_cropScale, _cropScale);
    ctx.drawImage(img, 0, 0);
    ctx.restore();
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.88));
    const filename = `poster_edit_${_posterEditId}_${Date.now()}.jpg`;
    const { error } = await db.storage.from('product-images').upload(filename, blob, { contentType: 'image/jpeg', upsert: true });
    if (error) { showToast('图片上传失败'); return; }
    imageUrl = db.storage.from('product-images').getPublicUrl(filename).data.publicUrl;
    replaced = true;
  }
  const { error: saveErr } = await db.from('posters').update({ title: title || null, image_url: imageUrl }).eq('id', _posterEditId);
  if (saveErr) {
    showToast('保存失败');
    if (replaced) db.storage.from('product-images').remove([storagePathFromUrl(imageUrl)].filter(Boolean));
    return;
  }
  if (replaced && oldUrl) {
    const path = storagePathFromUrl(oldUrl);
    if (path) db.storage.from('product-images').remove([path]);
  }
  showToast('已保存');
  closePosterEdit();
  delete tabProductsCache[currentTab];
  loadProducts();
}

// 绑定裁剪交互（DOM 就绪后）
document.addEventListener('DOMContentLoaded', () => {
  const zoom = document.getElementById('posterZoom');
  const frame = document.getElementById('posterCropFrame');

  zoom.addEventListener('input', function() {
    _cropScale = parseFloat(this.value);
    applyTransform();
  });

  frame.addEventListener('wheel', e => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? -0.05 : 0.05;
    _cropScale = Math.max(parseFloat(zoom.min), Math.min(parseFloat(zoom.max), _cropScale + delta * _cropScale));
    zoom.value = _cropScale;
    applyTransform();
  }, { passive: false });

  document.getElementById('posterReplaceInput').addEventListener('change', function() {
    const file = this.files[0];
    if (!file) return;
    _posterNewBlob = file;
    loadCropImage(URL.createObjectURL(file));
  });
});
</script>

<!-- 添加/编辑分类模态框 -->
<div class="modal-overlay" id="catModal">
  <div class="modal" style="width:420px">
    <div class="modal-title" id="catModalTitle">添加分类</div>
    <div class="form-group">
      <label>分类名称 <span style="color:#e74c3c">*</span></label>
      <input type="text" id="catName" placeholder="例：正山堂 · 骏眉中国">
    </div>
    <div class="form-group">
      <label>分类描述（选填）</label>
      <textarea id="catDesc" placeholder="简短介绍这个分类..." style="height:72px;resize:vertical"></textarea>
    </div>
    <div class="form-group">
      <label>封面图片（选填）</label>
      <div class="upload-area" id="catUploadArea" onclick="document.getElementById('catImageInput').click()">
        <div id="catUploadPlaceholder">点击选择图片，或拖拽图片到此处</div>
        <img id="catUploadPreview" style="display:none;max-width:100%;max-height:160px;border-radius:6px;margin-top:8px;">
      </div>
      <input type="file" id="catImageInput" accept="image/*" style="display:none" onchange="handleCatImageSelect(event)">
      <div id="catUploadStatus" style="font-size:12px;color:var(--ink-muted);margin-top:6px;"></div>
      <input type="hidden" id="catImage">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeCatModal()">取消</button>
      <button class="btn-save" onclick="saveCat()">保存</button>
    </div>
  </div>
</div>

<script>
// === 分类管理 ===
let editingCatId = null;
let catImageFile = null;
let catPanelVisible = false;

function toggleCatPanel() {
  catPanelVisible = !catPanelVisible;
  document.getElementById('catCardList').style.display = catPanelVisible ? '' : 'none';
  document.getElementById('btnAddCat').style.display = catPanelVisible ? '' : 'none';
  document.getElementById('catArrow').textContent = catPanelVisible ? '▼' : '▶';
  if (catPanelVisible) renderCatPanel();
}

function resetCatPanel() {
  catPanelVisible = false;
  document.getElementById('catCardList').style.display = 'none';
  document.getElementById('btnAddCat').style.display = 'none';
  document.getElementById('catArrow').textContent = '▶';
}

function renderCatPanel() {
  const type = tabConfig[currentTab].type;
  const all = categoriesCache.filter(c => c.type === type).sort((a,b) => (a.sort_order||0)-(b.sort_order||0));
  const cats = [...all.filter(c => c.is_visible !== false), ...all.filter(c => c.is_visible === false)];
  const list = document.getElementById('catCardList');
  if (!cats.length) {
    list.innerHTML = '<div class="cat-empty">暂无分类，点击「添加分类」创建第一个</div>';
    return;
  }
  list.innerHTML = cats.map(c => `
    <div class="cat-card" data-id="${c.id}" data-sort="${c.sort_order ?? 0}" data-visible="${c.is_visible !== false}">
      ${c.cover_url
        ? `<img class="cat-card-img" src="${c.cover_url}" alt="${c.name}" style="${c.is_visible === false ? 'opacity:0.4' : ''}">`
        : `<div class="cat-card-no-img">🖼</div>`}
      <div class="cat-card-info" style="${c.is_visible === false ? 'opacity:0.5' : ''}">
        <div class="cat-card-name">${c.name} ${c.is_visible === false ? '<span class="badge-hidden">已隐藏</span>' : ''}</div>
        ${c.description ? `<div class="cat-card-desc">${c.description}</div>` : ''}
      </div>
      <div class="sort-btns">
        <button class="sort-btn" onclick="moveCat('${c.id}', -1)">↑</button>
        <button class="sort-btn" onclick="moveCat('${c.id}', 1)">↓</button>
      </div>
      <div class="vs-selector">
        <button class="vs-btn vs-btn-show ${c.is_visible !== false ? 'vs-active-show' : ''}" onclick="setCatVisible('${c.id}', true)">显示</button>
        <button class="vs-btn vs-btn-hide ${c.is_visible === false ? 'vs-active-hide' : ''}" onclick="setCatVisible('${c.id}', false)">隐藏</button>
      </div>
      <button class="btn-edit" onclick="openCatModal('${c.id}')">编辑</button>
      <button class="btn-delete" onclick="deleteCat('${c.id}', '${c.name.replace(/'/g,"\\'")}')">删除</button>
    </div>
  `).join('');

  // 拖拽排序
  let dragSrc = null;
  list.querySelectorAll('.cat-card').forEach(card => {
    card.setAttribute('draggable', true);
    card.addEventListener('dragstart', () => { dragSrc = card; card.style.opacity = '0.4'; });
    card.addEventListener('dragend', () => { card.style.opacity = ''; });
    card.addEventListener('dragover', e => { e.preventDefault(); });
    card.addEventListener('drop', async e => {
      e.preventDefault();
      if (!dragSrc || dragSrc === card) return;
      const rows = [...list.querySelectorAll('.cat-card')];
      const idxA = rows.indexOf(dragSrc), idxB = rows.indexOf(card);
      if (idxA < idxB) list.insertBefore(dragSrc, card.nextSibling);
      else list.insertBefore(dragSrc, card);
      const newRows = [...list.querySelectorAll('.cat-card')];
      await Promise.all(newRows.map((r, i) => {
        r.dataset.sort = i * 10;
        return db.from('categories').update({ sort_order: i * 10 }).eq('id', r.dataset.id);
      }));
      await loadCategories();
      renderFilterBar();
    });
  });
}

function openCatModal(id) {
  editingCatId = id;
  catImageFile = null;
  document.getElementById('catModalTitle').textContent = id ? '编辑分类' : '添加分类';
  document.getElementById('catUploadPreview').style.display = 'none';
  document.getElementById('catUploadPlaceholder').style.display = 'block';
  document.getElementById('catUploadStatus').textContent = '';
  document.getElementById('catImage').value = '';
  if (id) {
    const c = categoriesCache.find(x => x.id === id);
    if (!c) return;
    document.getElementById('catName').value = c.name || '';
    document.getElementById('catDesc').value = c.description || '';
    if (c.cover_url) {
      document.getElementById('catImage').value = c.cover_url;
      document.getElementById('catUploadPreview').src = c.cover_url;
      document.getElementById('catUploadPreview').style.display = 'block';
      document.getElementById('catUploadPlaceholder').style.display = 'none';
    }
  } else {
    document.getElementById('catName').value = '';
    document.getElementById('catDesc').value = '';
  }
  document.getElementById('catModal').classList.add('open');
}

function closeCatModal() {
  document.getElementById('catModal').classList.remove('open');
  catImageFile = null;
}

function handleCatImageSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  catImageFile = file;
  const reader = new FileReader();
  reader.onload = ev => {
    const preview = document.getElementById('catUploadPreview');
    preview.src = ev.target.result;
    preview.style.display = 'block';
    document.getElementById('catUploadPlaceholder').style.display = 'none';
    document.getElementById('catUploadStatus').textContent = '图片已选择，保存时自动上传';
  };
  reader.readAsDataURL(file);
}

async function saveCat() {
  const name = document.getElementById('catName').value.trim();
  if (!name) { alert('请填写分类名称'); return; }
  const type = tabConfig[currentTab].type;
  let coverUrl = document.getElementById('catImage').value;
  const oldCoverUrl = coverUrl || null;
  let newCoverPath = null;

  if (catImageFile) {
    document.getElementById('catUploadStatus').textContent = '上传中...';
    const compressed = await compressImage(catImageFile);
    const filename = 'cat_' + Date.now() + '.jpg';
    const { data: upData, error: upErr } = await db.storage.from('product-images').upload(filename, compressed, { contentType: 'image/jpeg' });
    if (upErr) { alert('图片上传失败：' + upErr.message); return; }
    const { data: { publicUrl } } = db.storage.from('product-images').getPublicUrl(upData.path);
    coverUrl = publicUrl;
    newCoverPath = upData.path;
  }

  const payload = {
    name,
    description: document.getElementById('catDesc').value.trim() || null,
    cover_url: coverUrl || null,
    type,
  };

  let error;
  if (editingCatId) {
    ({ error } = await db.from('categories').update(payload).eq('id', editingCatId));
  } else {
    payload.key = 'cat_' + Date.now().toString(36);
    const sameType = categoriesCache.filter(c => c.type === tabConfig[currentTab].type);
    payload.sort_order = sameType.length * 10;
    ({ error } = await db.from('categories').insert(payload));
  }
  if (error) {
    alert('保存失败：' + error.message);
    if (newCoverPath) db.storage.from('product-images').remove([newCoverPath]);
    return;
  }

  if (catImageFile && oldCoverUrl) {
    const path = storagePathFromUrl(oldCoverUrl);
    if (path) db.storage.from('product-images').remove([path]);
  }

  closeCatModal();
  await loadCategories();
  renderCatPanel();
  renderFilterBar();
  delete tabProductsCache[currentTab];
  showToast('分类已保存');
}

async function deleteCat(id, name) {
  if (!confirm('确认删除分类「' + name + '」？\n\n注意：只删除分类本身，该分类下的商品数据不会被删除。')) return;
  const cat = categoriesCache.find(c => c.id === id);
  const { error } = await db.from('categories').delete().eq('id', id);
  if (error) { alert('删除失败：' + error.message); return; }
  const coverPath = storagePathFromUrl(cat?.cover_url);
  if (coverPath) db.storage.from('product-images').remove([coverPath]);
  await loadCategories();
  renderCatPanel();
  renderFilterBar();
  delete tabProductsCache[currentTab];
  loadProducts();
  showToast('分类已删除');
}

async function moveCat(id, dir) {
  const list = document.getElementById('catCardList');
  const rows = [...list.querySelectorAll('.cat-card')];
  const idx = rows.findIndex(r => r.dataset.id === id);
  const swapIdx = idx + dir;
  if (swapIdx < 0 || swapIdx >= rows.length) return;
  const rowA = rows[idx], rowB = rows[swapIdx];
  const sortA = rowA.dataset.sort, sortB = rowB.dataset.sort;
  // 交换 DOM
  if (dir === -1) list.insertBefore(rowA, rowB);
  else list.insertBefore(rowB, rowA);
  rowA.dataset.sort = sortB; rowB.dataset.sort = sortA;
  // 保存到 DB
  await Promise.all([
    db.from('categories').update({ sort_order: parseInt(sortB) }).eq('id', rowA.dataset.id),
    db.from('categories').update({ sort_order: parseInt(sortA) }).eq('id', rowB.dataset.id),
  ]);
  await loadCategories();
  renderFilterBar();
}

function setCatVisible(id, visible) {
  // 立即更新本地缓存
  const cat = categoriesCache.find(c => c.id === id);
  if (cat) cat.is_visible = visible;

  // 立即更新 DOM
  const list = document.getElementById('catCardList');
  const row = list?.querySelector(`.cat-card[data-id="${id}"]`);
  if (row) {
    row.dataset.visible = visible;
    const showBtn = row.querySelector('.vs-btn-show');
    const hideBtn = row.querySelector('.vs-btn-hide');
    const badge = row.querySelector('.badge-hidden');
    const nameEl = row.querySelector('.cat-card-name');
    const img = row.querySelector('.cat-card-img');
    const info = row.querySelector('.cat-card-info');
    if (visible) {
      showBtn?.classList.add('vs-active-show');
      hideBtn?.classList.remove('vs-active-hide');
      badge?.remove();
      if (img) img.style.opacity = '';
      if (info) info.style.opacity = '';
      // 移到第一个隐藏行之前
      const firstHidden = [...list.querySelectorAll('.cat-card')].find(r => r.dataset.visible === 'false');
      if (firstHidden) list.insertBefore(row, firstHidden);
    } else {
      showBtn?.classList.remove('vs-active-show');
      hideBtn?.classList.add('vs-active-hide');
      if (!badge && nameEl) nameEl.insertAdjacentHTML('beforeend', '<span class="badge-hidden">已隐藏</span>');
      if (img) img.style.opacity = '0.4';
      if (info) info.style.opacity = '0.5';
      // 沉到底部
      list.appendChild(row);
    }
    // 后台保存：可见性 + 重新计算 sort_order
    const rows = [...list.querySelectorAll('.cat-card')];
    const saves = [db.from('categories').update({ is_visible: visible }).eq('id', id)];
    rows.forEach((r, i) => { r.dataset.sort = i * 10; saves.push(db.from('categories').update({ sort_order: i * 10 }).eq('id', r.dataset.id)); });
    Promise.all(saves).then(() => { loadCategories(); renderFilterBar(); delete tabProductsCache[currentTab]; });
  }
}
</script>
