<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坐忘茗舍 · 管理后台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/locales-all.global.min.js"></script>
<style>
  :root {
    --bg: #F7F3EC;
    --surface: #EFEAD8;
    --ink: #1C2B2B;
    --ink-muted: #4A5C5A;
    --gold: #A8894A;
    --gold-soft: #EDE4CE;
    --sage: #6B8C7A;
    --border: #D8D0C0;
    --red: #9B4A3E;
    --red-soft: #F2E0DC;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; font-size: 15px; line-height: 1.6; }

  /* 登录页 */
  #loginPage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-box {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px;
    width: 360px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  .login-box h1 {
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .login-box p { color: var(--ink-muted); font-size: 13px; margin-bottom: 28px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
  .form-group input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    background: var(--bg);
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus { border-color: var(--gold); }
  .btn-primary {
    width: 100%;
    padding: 12px;
    background: var(--gold);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.2s;
  }
  .btn-primary:hover { opacity: 0.85; }
  .error-msg { color: var(--red); font-size: 13px; margin-top: 12px; text-align: center; min-height: 20px; }

  /* 主后台 */
  #adminPage { display: none; }
  .top-bar {
    background: white;
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .top-bar-title { font-weight: 700; font-size: 17px; color: var(--ink); }
  .top-bar-right { display: flex; align-items: center; gap: 16px; }
  .btn-logout {
    padding: 7px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: white;
    font-size: 13px;
    cursor: pointer;
    color: var(--ink-muted);
  }
  .btn-logout:hover { background: var(--bg); }

  .admin-layout { display: flex; min-height: calc(100vh - 60px); }

  /* 侧边栏 */
  .sidebar {
    width: 220px;
    background: white;
    border-right: 1px solid var(--border);
    padding: 24px 0;
    flex-shrink: 0;
  }
  .sidebar-section { padding: 0 16px; margin-bottom: 32px; }
  .sidebar-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-muted);
    font-weight: 600;
    padding: 0 8px;
    margin-bottom: 4px;
  }
  .sidebar-item {
    display: block;
    padding: 9px 12px 9px 20px;
    border-radius: 8px;
    font-size: 14px;
    color: var(--ink-muted);
    cursor: pointer;
    transition: all 0.15s;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
  }
  .sidebar-item:hover { background: var(--bg); color: var(--ink); }
  .sidebar-item.active { background: var(--gold-soft); color: var(--gold); font-weight: 600; }

  /* 主内容 */
  .main-content { flex: 1; padding: 32px; overflow-auto; }
  .page-header { margin-bottom: 28px; display: flex; align-items: center; justify-content: space-between; }
  .page-title { font-size: 22px; font-weight: 700; }
  .page-subtitle { color: var(--ink-muted); font-size: 13px; margin-top: 4px; }

  .btn-add {
    padding: 10px 20px;
    background: var(--gold);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn-add:hover { opacity: 0.85; }

  /* 分类选择器 */
  .filter-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .filter-chip {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: white;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--ink-muted);
  }
  .filter-chip:hover { border-color: var(--gold); color: var(--gold); }
  .filter-chip.active { background: var(--gold); border-color: var(--gold); color: white; font-weight: 600; }

  /* 商品卡片列表 */
  .product-list { display: flex; flex-direction: column; gap: 10px; }
  .product-row {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .product-row img {
    width: 60px;
    height: 60px;
    object-fit: cover;
    border-radius: 8px;
    background: var(--bg);
    flex-shrink: 0;
  }
  .product-row .no-img {
    width: 60px;
    height: 60px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px dashed var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: var(--ink-muted);
    flex-shrink: 0;
  }
  .product-info { flex: 1; }
  .product-name { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
  .product-meta { font-size: 12px; color: var(--ink-muted); }
  .product-actions { display: flex; gap: 8px; }
  .btn-edit, .btn-delete {
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: white;
    transition: all 0.15s;
  }
  .btn-edit:hover { border-color: var(--gold); color: var(--gold); }
  .btn-delete:hover { border-color: var(--red); color: var(--red); }
  .visibility-switch { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .vs-btn {
    padding: 5px 12px;
    font-size: 13px;
    cursor: pointer;
    border: none;
    background: white;
    color: var(--ink-muted);
    transition: all 0.15s;
  }
  .vs-btn:hover { background: var(--surface); }
  .vs-active-show { background: var(--sage) !important; color: white !important; }
  .vs-active-hide { background: var(--red-soft) !important; color: var(--red) !important; font-weight: 600; }
  .sort-btns { display: flex; flex-direction: column; gap: 2px; }
  .sort-btn { padding: 2px 8px; font-size: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; line-height: 1.4; color: var(--ink-muted); }
  .sort-btn:hover { background: #f5efe6; color: #8B6914; }
  .product-row[draggable="true"] { transition: box-shadow 0.15s; }
  .product-row.dragging { box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
  .badge-hidden {
    font-size: 11px;
    padding: 2px 8px;
    background: var(--red-soft);
    color: var(--red);
    border-radius: 10px;
    font-weight: 600;
  }

  /* 空状态 */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-muted);
  }
  .empty-state p { margin-top: 8px; font-size: 13px; }

  /* 模态框 */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    display: none;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white;
    border-radius: 12px;
    padding: 32px;
    width: 520px;
    max-width: 95vw;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 8px 40px rgba(0,0,0,0.15);
  }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 24px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
  .btn-cancel {
    padding: 10px 20px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: white;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-save {
    padding: 10px 24px;
    background: var(--gold);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .modal .form-group select {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    background: var(--bg);
    color: var(--ink);
    outline: none;
  }
  .modal .form-group textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    background: var(--bg);
    color: var(--ink);
    outline: none;
    resize: vertical;
    min-height: 80px;
    font-family: inherit;
  }
  .checkbox-row { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
  .checkbox-row input { width: 16px; height: 16px; cursor: pointer; }
  .checkbox-row label { font-size: 14px; color: var(--ink); cursor: pointer; }

  .toast {
    position: fixed;
    bottom: 32px;
    right: 32px;
    background: var(--ink);
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 9999;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .loading { text-align: center; color: var(--ink-muted); padding: 40px; }

  .upload-area {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s;
    color: var(--ink-muted);
    font-size: 13px;
    background: var(--bg);
  }
  .upload-area:hover { border-color: var(--gold); color: var(--gold); }

  /* 海报管理网格 */
  .poster-admin-grid { display: flex; flex-wrap: wrap; gap: 16px; }
  .poster-admin-card { width: 160px; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.08); }
  .poster-admin-img { width: 160px; aspect-ratio: 2/3; background-size: cover; background-position: center; background-color: var(--surface); }
  .poster-admin-title { font-size: 12px; padding: 6px 10px; color: var(--ink); font-weight: 600; }
  .poster-admin-actions { display: flex; gap: 5px; padding: 8px 10px; border-top: 1px solid var(--border); align-items: center; }
  .poster-admin-actions .poster-sort-col { display: flex; flex-direction: column; gap: 2px; }
  .poster-admin-actions .poster-sort-col .sort-btn { padding: 2px 8px; font-size: 11px; }
  .poster-admin-actions .btn-edit, .poster-admin-actions .btn-delete { flex: 1; }
  .poster-admin-vis { display: flex; border-top: 1px solid var(--border); }
  .poster-admin-vis .vs-btn { flex: 1; border-radius: 0; border: none; border-right: 1px solid var(--border); }
  .poster-admin-vis .vs-btn:last-child { border-right: none; }
  .poster-admin-img.is-hidden { opacity: 0.4; }

  /* 会员管理 */
  .member-row {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 10px;
  }
  .member-avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--gold-soft); color: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; flex-shrink: 0;
  }
  .member-info { flex: 1; min-width: 0; }
  .member-name { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
  .member-meta { font-size: 12px; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .member-search {
    width: 260px; max-width: 100%; padding: 9px 14px;
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; background: white; color: var(--ink); outline: none;
  }
  .member-search:focus { border-color: var(--gold); }

  .member-detail-modal .modal { width: 640px; }
  .member-detail-section { margin-top: 24px; }
  .member-detail-section h4 {
    font-size: 14px; font-weight: 700; color: var(--ink);
    margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .package-row, .purchase-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 8px; font-size: 13px; background: var(--bg);
  }
  .package-row .pkg-info, .purchase-row .pur-info { flex: 1; min-width: 0; }
  .package-row .pkg-name { font-weight: 600; margin-bottom: 2px; }
  .package-row .pkg-hours { color: var(--ink-muted); font-size: 12px; }
  .purchase-row .pur-item { font-weight: 600; margin-bottom: 2px; }
  .purchase-row .pur-meta { color: var(--ink-muted); font-size: 12px; }
  .btn-deduct {
    padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
    border: 1px solid var(--sage); background: white; color: var(--sage); font-weight: 600;
  }
  .btn-deduct:hover { background: var(--sage); color: white; }
  .btn-deduct:disabled { opacity: 0.4; cursor: not-allowed; border-color: var(--border); color: var(--ink-muted); background: white; }
  .btn-mini-delete {
    padding: 5px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;
    border: 1px solid var(--border); background: white; color: var(--ink-muted);
  }
  .btn-mini-delete:hover { border-color: var(--red); color: var(--red); }
  .add-inline-form {
    display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap;
  }
  .add-inline-form input {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 13px; background: white; color: var(--ink); outline: none;
  }
  .add-inline-form input:focus { border-color: var(--gold); }
  .add-inline-form .btn-add-inline {
    padding: 8px 14px; background: var(--gold); color: white; border: none;
    border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;
  }

  /* 行程日历 */
  #calendarEl {
    background: white; border: 1px solid var(--border); border-radius: 10px; padding: 16px;
  }

  @media (max-width: 680px) {
    /* 顶栏 */
    .admin-header { padding: 0 16px; }
    .header-brand { font-size: 15px; }
    .header-right { gap: 6px; }
    .btn-logout, .btn-change-pw { padding: 6px 10px; font-size: 12px; }
    .user-email { display: none; }

    /* 布局：侧边栏变顶部横条 */
    .admin-layout { flex-direction: column; }
    .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); padding: 12px 0 4px; }
    .sidebar-section { padding: 0 12px; }
    .sidebar-label { display: none; }
    .sidebar-section > div { display: flex; gap: 6px; flex-wrap: wrap; }
    .sidebar-item { width: auto; padding: 7px 14px; font-size: 13px; border-radius: 20px; border: 1px solid var(--border); }
    .sidebar-item.active { border-color: var(--gold); }

    /* 主内容 */
    .main-content { padding: 16px; }
    .page-title { font-size: 18px; }
    .page-header { flex-wrap: wrap; gap: 10px; }
    .btn-add { padding: 8px 14px; font-size: 13px; }

    /* 商品行 */
    .product-row { flex-wrap: wrap; gap: 10px; padding: 12px; }
    .product-row img, .product-row .no-img { width: 72px; height: 72px; }
    .product-info { flex: 1; min-width: 0; }
    .product-name { font-size: 14px; }
    .product-actions { width: 100%; justify-content: flex-end; gap: 6px; }
    .btn-edit, .btn-delete { padding: 6px 12px; font-size: 12px; }
    .vs-btn { padding: 6px 10px; font-size: 12px; }
    .sort-btn { padding: 4px 10px; }

    /* 会员行 */
    .member-row { flex-wrap: wrap; gap: 10px; padding: 12px; }
    .member-search { width: 100%; }
    .member-detail-modal .modal { width: 95vw; padding: 20px; }
    .add-inline-form { flex-direction: column; }
    .add-inline-form input, .add-inline-form .btn-add-inline { width: 100%; }

    /* 行程日历 */
    #calendarEl { padding: 8px; }
    #calendarEl .fc-toolbar { flex-direction: column; gap: 8px; }
    #calendarEl .fc-toolbar-title { font-size: 16px; }
    #calendarEl .fc-button { padding: 4px 8px; font-size: 12px; }
  }
</style>
</head>
<body>

<!-- 登录页 -->
<div id="loginPage">
  <div class="login-box">
    <h1>坐忘茗舍</h1>
    <p>主理人管理后台，请登录</p>
    <div class="form-group">
      <label>邮箱</label>
      <input type="email" id="loginEmail" placeholder="请输入邮箱">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="loginPassword" placeholder="请输入密码" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn-primary" onclick="doLogin()">登录</button>
    <div class="error-msg" id="loginError"></div>
  </div>
</div>

<!-- 管理后台 -->
<div id="adminPage">
  <div class="top-bar">
    <div class="top-bar-title">坐忘茗舍 · 管理后台</div>
    <div class="top-bar-right">
      <span id="userEmail" style="font-size:13px;color:var(--ink-muted)"></span>
      <button class="btn-logout" onclick="openPasswordModal()">修改密码</button>
      <button class="btn-logout" onclick="doLogout()">退出登录</button>
    </div>
  </div>

  <div class="admin-layout">
    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">内容管理</div>
        <button class="sidebar-item active" onclick="switchTab('tea')">精选茗茶</button>
        <button class="sidebar-item" onclick="switchTab('teaware')">茶器美学</button>
        <button class="sidebar-item" onclick="switchTab('guqin')">斫琴甄选</button>
        <button class="sidebar-item" onclick="switchTab('qindao')">琴道传习</button>
        <button class="sidebar-item" onclick="switchTab('yaji')">坐忘雅集</button>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">会员管理</div>
        <button class="sidebar-item" onclick="switchTab('qinren')">琴人档案</button>
        <button class="sidebar-item" onclick="switchTab('guests')">茗客档案</button>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">行程安排</div>
        <button class="sidebar-item" onclick="switchTab('schedule')">日程日历</button>
      </div>
    </div>

    <div class="main-content">
      <div class="page-header">
        <div>
          <div class="page-title" id="pageTitle">精选茗茶</div>
          <div class="page-subtitle" id="pageSubtitle">管理茶叶品牌与产品</div>
        </div>
        <button class="btn-add" id="btnAdd" onclick="openAddModal()">+ 添加商品</button>
        <button class="btn-add" id="btnAddPoster" onclick="openPosterUpload()" style="display:none">+ 上传海报</button>
        <button class="btn-add" id="btnAddMember" style="display:none">+ 添加记录</button>
      </div>

      <div class="filter-bar" id="filterBar"></div>
      <div id="productList"><div class="loading">加载中...</div></div>
    </div>
  </div>
</div>

<!-- 添加/编辑商品模态框 -->
<div class="modal-overlay" id="productModal">
  <div class="modal">
    <div class="modal-title" id="modalTitle">添加商品</div>
    <div class="form-group">
      <label>所属分类</label>
      <select id="modalCategory"></select>
    </div>
    <div class="form-group">
      <label>商品名称</label>
      <input type="text" id="modalName" placeholder="例：骏眉红茶 · 特级">
    </div>
    <div class="form-group">
      <label>简介</label>
      <textarea id="modalDesc" placeholder="简短描述这款商品..."></textarea>
    </div>
    <div class="form-group">
      <label>价格（选填）</label>
      <input type="text" id="modalPrice" placeholder="例：¥298 / 100g">
    </div>
    <div class="form-group">
      <label>商品图片（选填）</label>
      <div class="upload-area" id="uploadArea" onclick="document.getElementById('imageFileInput').click()">
        <div id="uploadPlaceholder">点击选择图片，或拖拽图片到此处</div>
        <img id="uploadPreview" style="display:none;max-width:100%;max-height:180px;border-radius:6px;margin-top:8px;">
      </div>
      <input type="file" id="imageFileInput" accept="image/*" style="display:none" onchange="handleImageSelect(event)">

// 图片压缩
function compressImage(file, maxW = 1200, quality = 0.82) {
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.width, h = img.height;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(blob => resolve(blob), 'image/jpeg', quality);
    };
    img.src = url;
  });
}

function handleImageSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  const preview = document.getElementById('uploadPreview');
  const placeholder = document.getElementById('uploadPlaceholder');
  const reader = new FileReader();
  reader.onload = e => {
    preview.src = e.target.result;
    preview.style.display = 'block';
    placeholder.style.display = 'none';
  };
  reader.readAsDataURL(file);
  document.getElementById('uploadStatus').textContent = '图片已选择，保存时自动上传';
}

async function uploadImageIfNeeded() {
  const file = document.getElementById('imageFileInput').files[0];
  if (!file) return document.getElementById('modalImage').value || null;
  document.getElementById('uploadStatus').textContent = '上传中...';
  const compressed = await compressImage(file);
  const ext = 'jpg';
  const filename = `${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
  const { data, error } = await db.storage.from('product-images').upload(filename, compressed, { contentType: 'image/jpeg' });
  if (error) { showToast('图片上传失败'); return null; }
  const { data: { publicUrl } } = db.storage.from('product-images').getPublicUrl(filename);
  document.getElementById('uploadStatus').textContent = '上传成功';
  return publicUrl;
}

    await db.from('products').update(payload).eq('id', editingId);

  } else {
    await db.from('products').insert(payload);

function setVisible(id, visible) {
  const list = document.getElementById('sortableList');
  const row = document.querySelector(`.product-row[data-id="${id}"]`);
  if (!row) return;

  // 更新按钮和徽标
  const showBtn = row.querySelector('.vs-btn-show');
  const hideBtn = row.querySelector('.vs-btn-hide');
  const badge = row.querySelector('.badge-hidden');
  if (visible) {
    showBtn.classList.add('vs-active-show');
    hideBtn.classList.remove('vs-active-hide');
    if (badge) badge.remove();
  } else {
    showBtn.classList.remove('vs-active-show');
    hideBtn.classList.add('vs-active-hide');
    if (!badge) {
      row.querySelector('.product-name').insertAdjacentHTML('beforeend', '<span class="badge-hidden">已隐藏</span>');
    }
  }

  // 移动行位置：隐藏移到最底部，显示移到第一个隐藏行之前
  if (list) {
    if (!visible) {
      list.appendChild(row);
    } else {
      const firstHidden = [...list.querySelectorAll('.product-row')].find(r => r.querySelector('.badge-hidden'));
      if (firstHidden) list.insertBefore(row, firstHidden);
    }
  }

  // 后台保存：可见性 + 重新计算所有行的 sort_order
  const rows = list ? [...list.querySelectorAll('.product-row')] : [];
  const saves = [db.from('products').update({ is_visible: visible }).eq('id', id)];
  rows.forEach((r, i) => { r.dataset.sort = i; saves.push(db.from('products').update({ sort_order: i }).eq('id', r.dataset.id)); });
  Promise.all(saves).then(results => {
    if (results[0].error) setVisible(id, !visible);
  });
}

async function moveProduct(id, direction) {
  const list = document.getElementById('sortableList');
  const rows = [...list.querySelectorAll('.product-row')];
  const idx = rows.findIndex(r => r.dataset.id === id);
  const targetIdx = idx + direction;
  if (targetIdx < 0 || targetIdx >= rows.length) return;

  const rowA = rows[idx];
  const rowB = rows[targetIdx];

  // 动画：先记录各自位置
  const rectA = rowA.getBoundingClientRect();
  const rectB = rowB.getBoundingClientRect();
  const diffA = rectB.top - rectA.top;
  const diffB = rectA.top - rectB.top;

  // DOM 交换
  if (direction === -1) {
    list.insertBefore(rowA, rowB);
  } else {
    list.insertBefore(rowB, rowA);
  }

  // 交换 data-sort
  const sortA = rowA.dataset.sort;
  const sortB = rowB.dataset.sort;
  rowA.dataset.sort = sortB;
  rowB.dataset.sort = sortA;

  // FLIP 动画
  rowA.style.transition = 'none';
  rowB.style.transition = 'none';
  rowA.style.transform = `translateY(${-diffA}px)`;
  rowB.style.transform = `translateY(${-diffB}px)`;
  rowA.offsetHeight; // force reflow
  rowA.style.transition = 'transform 0.25s ease';
  rowB.style.transition = 'transform 0.25s ease';
  rowA.style.transform = '';
  rowB.style.transform = '';

  // 后台保存
  await Promise.all([
    db.from('products').update({ sort_order: parseInt(sortB) }).eq('id', rowA.dataset.id),
    db.from('products').update({ sort_order: parseInt(sortA) }).eq('id', rowB.dataset.id),
  ]);
}

function initDragSort() {
  const list = document.getElementById('sortableList');
  if (!list) return;
  let dragging = null;

  list.addEventListener('dragstart', e => {
    dragging = e.target.closest('.product-row');
    if (!dragging) return;
    setTimeout(() => { dragging.style.opacity = '0.4'; }, 0);
  });

  list.addEventListener('dragend', async e => {
    const el = dragging;
    dragging = null;
    if (!el) return;
    el.style.opacity = '';
    el.style.transition = '';
    const rows = [...list.querySelectorAll('.product-row')];
    await Promise.all(rows.map((r, i) => {
      r.dataset.sort = i;
      return db.from('products').update({ sort_order: i }).eq('id', r.dataset.id);
    }));
  });

  // 兜底：任何情况松手都还原透明度
  document.addEventListener('mouseup', () => {
    document.querySelectorAll('.product-row').forEach(r => r.style.opacity = '');
  });

  list.addEventListener('dragover', e => {
    e.preventDefault();
    if (!dragging) return;
    const target = e.target.closest('.product-row');
    if (!target || target === dragging) return;
    const rect = target.getBoundingClientRect();
    const mid = rect.top + rect.height / 2;
    if (e.clientY < mid) {
      list.insertBefore(dragging, target);
    } else {
      list.insertBefore(dragging, target.nextSibling);
    }
  });
}

function storagePathFromUrl(url) {
  if (!url) return null;
  const marker = '/product-images/';
  const idx = url.indexOf(marker);
  if (idx === -1) return null;
  return decodeURIComponent(url.slice(idx + marker.length));
}

function initPosterDragSort() {
  const grid = document.getElementById('posterSortGrid');
  if (!grid) return;
  let dragging = null;
  grid.addEventListener('dragstart', e => {
    dragging = e.target.closest('.poster-admin-card');
    if (!dragging) return;
    setTimeout(() => { dragging.style.opacity = '0.4'; }, 0);
  });
  grid.addEventListener('dragend', async () => {
    const el = dragging; dragging = null;
    if (!el) return;
    el.style.opacity = '';
    const cards = [...grid.querySelectorAll('.poster-admin-card')];
    await Promise.all(cards.map((c, i) => {
      c.dataset.sort = i;
      return db.from('posters').update({ sort_order: i }).eq('id', c.dataset.id);
    }));
  });
  document.addEventListener('mouseup', () => {
    grid.querySelectorAll('.poster-admin-card').forEach(c => c.style.opacity = '');
  });
  grid.addEventListener('dragover', e => {
    e.preventDefault();
    if (!dragging) return;
    const target = e.target.closest('.poster-admin-card');
    if (!target || target === dragging) return;
    const rect = target.getBoundingClientRect();
    if (e.clientX < rect.left + rect.width / 2) grid.insertBefore(dragging, target);
    else grid.insertBefore(dragging, target.nextSibling);
  });
}

function openPosterUpload() {
  const section = tabConfig[currentTab].section;
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    showToast('上传中…');
    // 压缩到 3:4
    const blob = await cropAndCompress(file, 3, 4);
    const filename = `poster_${section}_${Date.now()}.jpg`;
    const { error: upErr } = await db.storage.from('product-images').upload(filename, blob, { contentType: 'image/jpeg' });
    if (upErr) { showToast('上传失败'); return; }
    const { data: { publicUrl } } = db.storage.from('product-images').getPublicUrl(filename);
    await db.from('posters').insert({ section, image_url: publicUrl, sort_order: 999 });
    showToast('海报已上传');
    loadProducts();
  };
  input.click();
}

async function cropAndCompress(file, ratioW, ratioH) {
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const srcW = img.width, srcH = img.height;
      let cropW = srcW, cropH = Math.round(srcW * ratioH / ratioW);
      if (cropH > srcH) { cropH = srcH; cropW = Math.round(srcH * ratioW / ratioH); }
      const offX = Math.round((srcW - cropW) / 2);
      const offY = Math.round((srcH - cropH) / 2);
      const maxH = 1440;
      const scale = cropH > maxH ? maxH / cropH : 1;
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(cropW * scale);
      canvas.height = Math.round(cropH * scale);
      canvas.getContext('2d').drawImage(img, offX, offY, cropW, cropH, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.85);
    };
    img.src = url;
  });
}

function setVisiblePoster(id, visible) {
  const grid = document.getElementById('posterSortGrid');
  const card = document.querySelector(`.poster-admin-card[data-id="${id}"]`);
  if (!card) return;
  const showBtn = card.querySelector('.vs-btn-show');
  const hideBtn = card.querySelector('.vs-btn-hide');
  const img = card.querySelector('.poster-admin-img');
  if (visible) {
    showBtn.classList.add('vs-active-show');
    hideBtn.classList.remove('vs-active-hide');
    img.classList.remove('is-hidden');
  } else {
    showBtn.classList.remove('vs-active-show');
    hideBtn.classList.add('vs-active-hide');
    img.classList.add('is-hidden');
  }
  // 隐藏的沉到底部，显示的浮到最前
  if (grid) {
    if (!visible) {
      grid.appendChild(card);
    } else {
      const firstHidden = [...grid.querySelectorAll('.poster-admin-card')].find(c => c.querySelector('.poster-admin-img.is-hidden'));
      if (firstHidden) grid.insertBefore(card, firstHidden);
    }
  }
  const cards = grid ? [...grid.querySelectorAll('.poster-admin-card')] : [];
  const saves = [db.from('posters').update({ is_visible: visible }).eq('id', id)];
  cards.forEach((c, i) => { c.dataset.sort = i; saves.push(db.from('posters').update({ sort_order: i }).eq('id', c.dataset.id)); });
  Promise.all(saves).then(results => {
    if (results[0].error) setVisiblePoster(id, !visible);
  });
}

async function deletePoster(id) {

  const { data } = await db.from('posters').select('image_url').eq('id', id).single();
  await db.from('posters').delete().eq('id', id);

async function movePoster(id, direction) {
  const cards = [...document.querySelectorAll('.poster-admin-card')];
  const idx = cards.findIndex(c => c.dataset.id === id);
  const targetIdx = idx + direction;
  if (targetIdx < 0 || targetIdx >= cards.length) return;
  const grid = cards[idx].parentNode;
  if (direction === -1) grid.insertBefore(cards[idx], cards[targetIdx]);
  else grid.insertBefore(cards[targetIdx], cards[idx]);
  const allCards = [...grid.querySelectorAll('.poster-admin-card')];
  await Promise.all(allCards.map((c, i) => db.from('posters').update({ sort_order: i }).eq('id', c.dataset.id)));
}

async function loadMembers() {
  const cfg = tabConfig[currentTab];
  const memberType = cfg.memberType;
  const search = document.getElementById('memberSearch');
  const keyword = (search ? search.value.trim() : '').toLowerCase();

  if (memberType === 'class') {
    const { data } = await db.from('class_packages').select('member_id, total_hours, used_hours, members(id, name, phone)').order('created_at');
    const map = new Map();
    (data || []).forEach(r => {
      if (!r.members) return;
      if (!map.has(r.member_id)) map.set(r.member_id, { id: r.member_id, name: r.members.name, phone: r.members.phone, remaining: 0, packages: 0 });
      const entry = map.get(r.member_id);
      entry.remaining += (r.total_hours - r.used_hours);
      entry.packages += 1;
    });
    let list = [...map.values()];
    if (keyword) list = list.filter(m => m.name.toLowerCase().includes(keyword));
    renderMemberList(list, 'class');
  } else {
    const { data } = await db.from('purchases').select('member_id, amount, members(id, name, phone)').order('purchased_at', { ascending: false });
    const map = new Map();
    (data || []).forEach(r => {
      if (!r.members) return;
      if (!map.has(r.member_id)) map.set(r.member_id, { id: r.member_id, name: r.members.name, phone: r.members.phone, total: 0, count: 0 });
      const entry = map.get(r.member_id);
      entry.total += Number(r.amount) || 0;
      entry.count += 1;
    });
    let list = [...map.values()];
    if (keyword) list = list.filter(m => m.name.toLowerCase().includes(keyword));
    renderMemberList(list, 'purchase');
  }
}

let calendarInstance = null;

function formatSlotLabel(date) {
  const h = date.getHours();
  const m = date.getMinutes();
  const period = h < 12 ? '上午' : '下午';
  let h12 = h % 12;
  if (h12 === 0) h12 = 12;
  return m === 0 ? `${period}${h12}点` : `${period}${h12}点${m}分`;
}

async function renderCalendar() {
  const { data } = await db.from('schedule_events').select('*, members(name)').order('start_at');
  const events = (data || []).map(e => ({
    id: e.id,
    title: e.members?.name ? `${e.members.name} · ${e.title}` : e.title,
    start: e.start_at,
    end: e.end_at,
  }));

  const el = document.getElementById('calendarEl');
  if (!el) return;
  if (calendarInstance) { calendarInstance.destroy(); calendarInstance = null; }
  calendarInstance = new FullCalendar.Calendar(el, {
    locale: 'zh-cn',
    height: 'auto',
    headerToolbar: { left: 'prev,next today', center: 'title', right: 'multiMonthYear,dayGridMonth,timeGridWeek,timeGridDay' },
    buttonText: { today: '今天', multiMonthYear: '年', dayGridMonth: '月', timeGridWeek: '周', timeGridDay: '日', list: '列表' },
    allDayText: '全天',
    slotLabelContent: (arg) => formatSlotLabel(arg.date),
    initialView: 'dayGridMonth',
    events,
    selectable: true,
    select: (info) => { openAddEventModal(null, info.start, info.end); calendarInstance.unselect(); },
    eventClick: (info) => openEditEventModal(info.event.id),
  });
  calendarInstance.render();
}

function toDatetimeLocal(dateOrStr) {
  const d = dateOrStr instanceof Date ? dateOrStr : new Date(dateOrStr);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

  document.getElementById('eventEnd').value = toDatetimeLocal(data.end_at);
  await populateEventMemberSelect(data.member_id);
  document.getElementById('eventModal').classList.add('open');
}

async function populateEventMemberSelect(selectedId) {
  const { data: members } = await db.from('members').select('id, name').order('name');
  const select = document.getElementById('eventMemberSelect');
  select.innerHTML = '<option value="">不关联会员（个人行程）</option>' + (members || []).map(m => `<option value="${m.id}">${m.name}</option>`).join('');
  select.value = selectedId || '';
}

function closeEventModal() {
  document.getElementById('eventModal').classList.remove('open');
}

async function saveEvent() {
  const id = document.getElementById('eventEditId').value;
  const title = document.getElementById('eventTitle').value.trim();
  const memberId = document.getElementById('eventMemberSelect').value || null;
  const startVal = document.getElementById('eventStart').value;
  const endVal = document.getElementById('eventEnd').value;
  if (!title || !startVal || !endVal) { showToast('请填写标题和起止时间'); return; }
  const payload = {
    title,
    member_id: memberId,
    start_at: new Date(startVal).toISOString(),
    end_at: new Date(endVal).toISOString(),
    note: document.getElementById('eventNote').value.trim() || null,
  };
  if (id) await db.from('schedule_events').update(payload).eq('id', id);
  else await db.from('schedule_events').insert(payload);
  showToast('已保存');
  closeEventModal();
  renderCalendar();
  if (currentMemberId) await refreshUpcoming();
}

async function deleteEvent() {
  const id = document.getElementById('eventEditId').value;
  if (!id || !confirm('确定删除这条行程吗？')) return;
  await db.from('schedule_events').delete().eq('id', id);
  showToast('已删除');
  closeEventModal();
  renderCalendar();
  if (currentMemberId) await refreshUpcoming();
}

// 会员详情里的"预约上课"
function formatEventTime(startIso, endIso) {
  const s = new Date(startIso), e = new Date(endIso);
  const pad = n => String(n).padStart(2, '0');
  return `${s.getMonth() + 1}月${s.getDate()}日 ${pad(s.getHours())}:${pad(s.getMinutes())}-${pad(e.getHours())}:${pad(e.getMinutes())}`;
}

function renderUpcoming(events) {
  const el = document.getElementById('upcomingList');
  if (!el) return;
  if (!events.length) {
    el.innerHTML = '<div style="color:var(--ink-muted);font-size:13px">暂无预约</div>';
    return;
  }
  el.innerHTML = events.map(e => `
    <div class="purchase-row" data-id="${e.id}">
      <div class="pur-info">
        <div class="pur-item">${e.title}</div>
        <div class="pur-meta">${formatEventTime(e.start_at, e.end_at)}</div>
      </div>
      <button class="btn-mini-delete" onclick="openEditEventModal('${e.id}')">编辑</button>
    </div>
  `).join('');
}

async function refreshUpcoming() {
  if (!currentMemberId) return;
  const { data } = await db.from('schedule_events').select('*').eq('member_id', currentMemberId).gte('start_at', new Date().toISOString()).order('start_at');
  renderUpcoming(data || []);
}

function quickAddEventForMember() {
  openAddEventModal(currentMemberId);
}

function switchTab(tab) {
  currentTab = tab;
  currentFilter = null;
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  event.target.classList.add('active');

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

  document.getElementById('newPassword').value = '';
  document.getElementById('confirmPassword').value = '';
  document.getElementById('passwordError').textContent = '';

}

function closePasswordModal() {

}

async function savePassword() {
  const np = document.getElementById('newPassword').value;
  const cp = document.getElementById('confirmPassword').value;
  document.getElementById('passwordError').textContent = '';
  if (np.length < 6) { document.getElementById('passwordError').textContent = '密码至少 6 位'; return; }

  showToast('密码已修改');
}

// ── 海报编辑弹窗 ──────────────────────────────────────
let _posterEditId = null;
let _posterOrigUrl = null;
let _posterNewBlob = null;
let _cropScale = 1, _cropX = 0, _cropY = 0;
let _posterDragStart = null;

function openPosterEdit(id, title, imageUrl) {
  _posterEditId = id;
  _posterOrigUrl = imageUrl;
  _posterNewBlob = null;
  document.getElementById('posterEditTitle').value = title;
  const ov = document.getElementById('posterEditOverlay');
  ov.style.display = 'flex';
  loadCropImage(imageUrl);
}

function loadCropImage(url) {
  const img = document.getElementById('posterCropImg');
  const frame = document.getElementById('posterCropFrame');
  const zoom = document.getElementById('posterZoom');
  _cropScale = 1;
  img.onload = () => {
    const fw = frame.clientWidth, fh = frame.clientHeight;
    const fitScale = Math.max(fw / img.naturalWidth, fh / img.naturalHeight);
    _cropScale = fitScale;
    zoom.min = fitScale * 0.5;
    zoom.max = fitScale * 4;
    zoom.step = fitScale * 0.01;
    zoom.value = fitScale;
    applyTransform();
  };
  img.src = url;
}

function applyTransform() {
  const img = document.getElementById('posterCropImg');
  const frame = document.getElementById('posterCropFrame');
  const fw = frame.clientWidth, fh = frame.clientHeight;
  const iw = img.naturalWidth * _cropScale, ih = img.naturalHeight * _cropScale;
  img.style.left = ((fw - iw) / 2) + 'px';
  img.style.top = ((fh - ih) / 2) + 'px';
  img.style.width = iw + 'px';
  img.style.height = ih + 'px';
  img.style.transform = '';
}

function closePosterEdit() {
  document.getElementById('posterEditOverlay').style.display = 'none';
  _posterEditId = null; _posterNewBlob = null;
}

function triggerPosterReplace() {
  document.getElementById('posterReplaceInput').click();
}

async function savePosterEdit() {
  if (!_posterEditId) return;
  const title = document.getElementById('posterEditTitle').value.trim();
  showToast('保存中…');
  let imageUrl = _posterOrigUrl;
  if (_posterNewBlob) {
    const frame = document.getElementById('posterCropFrame');
    const img = document.getElementById('posterCropImg');
    const fw = frame.clientWidth, fh = frame.clientHeight;
    const outW = 1080, outH = 1620;
    const canvas = document.createElement('canvas');
    canvas.width = outW; canvas.height = outH;
    const ctx = canvas.getContext('2d');
    const iw = img.naturalWidth * _cropScale, ih = img.naturalHeight * _cropScale;
    const offsetX = (fw - iw) / 2, offsetY = (fh - ih) / 2;
    const sx = outW / fw, sy = outH / fh;
    ctx.save();
    ctx.scale(sx, sy);
    ctx.translate(offsetX, offsetY);
    ctx.scale(_cropScale, _cropScale);
    ctx.drawImage(img, 0, 0);
    ctx.restore();
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.88));
    const filename = `poster_edit_${_posterEditId}_${Date.now()}.jpg`;
    const { error } = await db.storage.from('product-images').upload(filename, blob, { contentType: 'image/jpeg', upsert: true });
    if (error) { showToast('图片上传失败'); return; }
    imageUrl = db.storage.from('product-images').getPublicUrl(filename).data.publicUrl;
  }
  await db.from('posters').update({ title: title || null, image_url: imageUrl }).eq('id', _posterEditId);
  showToast('已保存');
  closePosterEdit();
  loadProducts();
}

// 绑定裁剪交互（DOM 就绪后）
document.addEventListener('DOMContentLoaded', () => {
  const zoom = document.getElementById('posterZoom');
  const frame = document.getElementById('posterCropFrame');

  zoom.addEventListener('input', function() {
    _cropScale = parseFloat(this.value);
    applyTransform();
  });

  frame.addEventListener('wheel', e => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? -0.05 : 0.05;
    _cropScale = Math.max(parseFloat(zoom.min), Math.min(parseFloat(zoom.max), _cropScale + delta * _cropScale));
    zoom.value = _cropScale;
    applyTransform();
  }, { passive: false });

  document.getElementById('posterReplaceInput').addEventListener('change', function() {
    const file = this.files[0];
    if (!file) return;
    _posterNewBlob = file;
    loadCropImage(URL.createObjectURL(file));
  });
});
</script>

<!-- 海报编辑弹窗 -->
<div id="posterEditOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:1100;display:none;align-items:center;justify-content:center" onclick="if(event.target===this)closePosterEdit()">
  <div style="background:white;border-radius:14px;width:360px;max-width:94vw;max-height:92vh;overflow-y:auto;padding:22px;box-shadow:0 8px 40px rgba(0,0,0,0.18)" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h3 style="margin:0;font-size:15px;font-weight:700">编辑海报</h3>
      <button onclick="closePosterEdit()" style="font-size:20px;background:none;border:none;cursor:pointer;color:var(--ink-muted);line-height:1">×</button>
    </div>

    <div style="margin-bottom:12px">
      <div id="posterCropFrame" style="width:100%;aspect-ratio:2/3;background:#f0ece6;border-radius:8px;overflow:hidden;position:relative;user-select:none">
        <img id="posterCropImg" src="" draggable="false" style="position:absolute;transform-origin:center center;max-width:none;max-height:none">
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
        <span style="font-size:11px;color:var(--ink-muted);white-space:nowrap">缩小</span>
        <input type="range" id="posterZoom" min="0.1" max="3" step="0.01" value="1" style="flex:1">
        <span style="font-size:11px;color:var(--ink-muted);white-space:nowrap">放大</span>
      </div>
      <div style="font-size:11px;color:var(--ink-muted);margin-top:4px;text-align:center">滑块或滚轮调整大小 · 图片自动居中</div>
      <button onclick="triggerPosterReplace()" style="margin-top:8px;font-size:12px;padding:5px 12px;border:1px solid var(--border);background:var(--surface);border-radius:6px;cursor:pointer;color:var(--ink-muted);width:100%">换一张图片</button>
      <input type="file" id="posterReplaceInput" accept="image/*" style="display:none">
    </div>

    <div style="margin-bottom:14px">
      <div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px">显示文字（可留空）</div>
      <input type="text" id="posterEditTitle" placeholder="例：秋季古琴入门小班" style="width:100%;padding:9px;border:1px solid var(--border);border-radius:8px;font-size:13px;box-sizing:border-box">
    </div>

    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button onclick="closePosterEdit()" style="padding:8px 16px;border:1px solid var(--border);background:white;border-radius:8px;cursor:pointer;font-size:13px">取消</button>
      <button onclick="savePosterEdit()" style="padding:8px 20px;background:var(--gold);color:white;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px">保存</button>
    </div>
  </div>
</div>
