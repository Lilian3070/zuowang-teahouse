<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坐忘茗舍 · 管理后台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #F7F3EC;
    --surface: #EFEAD8;
    --ink: #1C2B2B;
    --ink-muted: #4A5C5A;
    --gold: #A8894A;
    --gold-soft: #EDE4CE;
    --sage: #6B8C7A;
    --border: #D8D0C0;
    --red: #9B4A3E;
    --red-soft: #F2E0DC;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; font-size: 15px; line-height: 1.6; }

  /* 登录页 */
  #loginPage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-box {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px;
    width: 360px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  .login-box h1 {
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .login-box p { color: var(--ink-muted); font-size: 13px; margin-bottom: 28px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
  .form-group input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    background: var(--bg);
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus { border-color: var(--gold); }
  .btn-primary {
    width: 100%;
    padding: 12px;
    background: var(--gold);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.2s;
  }
  .btn-primary:hover { opacity: 0.85; }
  .error-msg { color: var(--red); font-size: 13px; margin-top: 12px; text-align: center; min-height: 20px; }

  /* 主后台 */
  #adminPage { display: none; }
  .top-bar {
    background: white;
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .top-bar-title { font-weight: 700; font-size: 17px; color: var(--ink); }
  .top-bar-right { display: flex; align-items: center; gap: 16px; }
  .btn-logout {
    padding: 7px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: white;
    font-size: 13px;
    cursor: pointer;
    color: var(--ink-muted);
  }
  .btn-logout:hover { background: var(--bg); }

  .admin-layout { display: flex; min-height: calc(100vh - 60px); }

  /* 侧边栏 */
  .sidebar {
    width: 220px;
    background: white;
    border-right: 1px solid var(--border);
    padding: 24px 0;
    flex-shrink: 0;
  }
  .sidebar-section { padding: 0 16px; margin-bottom: 8px; }
  .sidebar-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-muted);
    font-weight: 600;
    padding: 0 8px;
    margin-bottom: 4px;
  }
  .sidebar-item {
    display: block;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 14px;
    color: var(--ink-muted);
    cursor: pointer;
    transition: all 0.15s;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
  }
  .sidebar-item:hover { background: var(--bg); color: var(--ink); }
  .sidebar-item.active { background: var(--gold-soft); color: var(--gold); font-weight: 600; }

  /* 主内容 */
  .main-content { flex: 1; padding: 32px; overflow-auto; }
  .page-header { margin-bottom: 28px; display: flex; align-items: center; justify-content: space-between; }
  .page-title { font-size: 22px; font-weight: 700; }
  .page-subtitle { color: var(--ink-muted); font-size: 13px; margin-top: 4px; }

  .btn-add {
    padding: 10px 20px;
    background: var(--gold);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn-add:hover { opacity: 0.85; }

  /* 分类选择器 */
  .filter-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .filter-chip {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: white;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--ink-muted);
  }
  .filter-chip:hover { border-color: var(--gold); color: var(--gold); }
  .filter-chip.active { background: var(--gold); border-color: var(--gold); color: white; font-weight: 600; }

  /* 商品卡片列表 */
  .product-list { display: flex; flex-direction: column; gap: 10px; }
  .product-row {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .product-row img {
    width: 60px;
    height: 60px;
    object-fit: cover;
    border-radius: 8px;
    background: var(--bg);
    flex-shrink: 0;
  }
  .product-row .no-img {
    width: 60px;
    height: 60px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px dashed var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: var(--ink-muted);
    flex-shrink: 0;
  }
  .product-info { flex: 1; }
  .product-name { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
  .product-meta { font-size: 12px; color: var(--ink-muted); }
  .product-actions { display: flex; gap: 8px; }
  .btn-edit, .btn-delete {
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: white;
    transition: all 0.15s;
  }
  .btn-edit:hover { border-color: var(--gold); color: var(--gold); }
  .btn-delete:hover { border-color: var(--red); color: var(--red); }
  .visibility-switch { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .vs-btn {
    padding: 5px 12px;
    font-size: 13px;
    cursor: pointer;
    border: none;
    background: white;
    color: var(--ink-muted);
    transition: all 0.15s;
  }
  .vs-btn:hover { background: var(--surface); }
  .vs-active-show { background: var(--sage) !important; color: white !important; }
  .vs-active-hide { background: var(--red-soft) !important; color: var(--red) !important; font-weight: 600; }
  .sort-btns { display: flex; flex-direction: column; gap: 2px; }
  .sort-btn { padding: 2px 8px; font-size: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; line-height: 1.4; color: var(--ink-muted); }
  .sort-btn:hover { background: #f5efe6; color: #8B6914; }
  .product-row[draggable="true"] { transition: box-shadow 0.15s; }
  .product-row.dragging { box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
  .badge-hidden {
    font-size: 11px;
    padding: 2px 8px;
    background: var(--red-soft);
    color: var(--red);
    border-radius: 10px;
    font-weight: 600;
  }

  /* 空状态 */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-muted);
  }
  .empty-state p { margin-top: 8px; font-size: 13px; }

  /* 模态框 */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    display: none;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white;
    border-radius: 12px;
    padding: 32px;
    width: 520px;
    max-width: 95vw;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 8px 40px rgba(0,0,0,0.15);
  }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 24px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
  .btn-cancel {
    padding: 10px 20px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: white;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-save {
    padding: 10px 24px;
    background: var(--gold);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .modal .form-group select {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    background: var(--bg);
    color: var(--ink);
    outline: none;
  }
  .modal .form-group textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    background: var(--bg);
    color: var(--ink);
    outline: none;
    resize: vertical;
    min-height: 80px;
    font-family: inherit;
  }
  .checkbox-row { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
  .checkbox-row input { width: 16px; height: 16px; cursor: pointer; }
  .checkbox-row label { font-size: 14px; color: var(--ink); cursor: pointer; }

  .toast {
    position: fixed;
    bottom: 32px;
    right: 32px;
    background: var(--ink);
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 9999;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .loading { text-align: center; color: var(--ink-muted); padding: 40px; }

  .upload-area {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s;
    color: var(--ink-muted);
    font-size: 13px;
    background: var(--bg);
  }
  .upload-area:hover { border-color: var(--gold); color: var(--gold); }

  /* 海报管理网格 */
  .poster-admin-grid { display: flex; flex-wrap: wrap; gap: 16px; }
  .poster-admin-card { width: 180px; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.08); }
  .poster-admin-img { width: 180px; height: 240px; background-size: cover; background-position: center; background-color: var(--surface); }
  .poster-admin-title { font-size: 12px; padding: 6px 10px; color: var(--ink); font-weight: 600; }
  .poster-admin-actions { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--border); }
  .poster-admin-actions .sort-btn { flex: 1; }
  .poster-admin-actions .btn-delete { flex: 1; }

  @media (max-width: 680px) {
    /* 顶栏 */
    .admin-header { padding: 0 16px; }
    .header-brand { font-size: 15px; }
    .header-right { gap: 6px; }
    .btn-logout, .btn-change-pw { padding: 6px 10px; font-size: 12px; }
    .user-email { display: none; }

    /* 布局：侧边栏变顶部横条 */
    .admin-layout { flex-direction: column; }
    .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); padding: 12px 0 4px; }
    .sidebar-section { padding: 0 12px; }
    .sidebar-label { display: none; }
    .sidebar-section > div { display: flex; gap: 6px; flex-wrap: wrap; }
    .sidebar-item { width: auto; padding: 7px 14px; font-size: 13px; border-radius: 20px; border: 1px solid var(--border); }
    .sidebar-item.active { border-color: var(--gold); }

    /* 主内容 */
    .main-content { padding: 16px; }
    .page-title { font-size: 18px; }
    .page-header { flex-wrap: wrap; gap: 10px; }
    .btn-add { padding: 8px 14px; font-size: 13px; }

    /* 商品行 */
    .product-row { flex-wrap: wrap; gap: 10px; padding: 12px; }
    .product-row img, .product-row .no-img { width: 72px; height: 72px; }
    .product-info { flex: 1; min-width: 0; }
    .product-name { font-size: 14px; }
    .product-actions { width: 100%; justify-content: flex-end; gap: 6px; }
    .btn-edit, .btn-delete { padding: 6px 12px; font-size: 12px; }
    .vs-btn { padding: 6px 10px; font-size: 12px; }
    .sort-btn { padding: 4px 10px; }
  }
</style>
</head>
<body>

<!-- 登录页 -->
<div id="loginPage">
  <div class="login-box">
    <h1>坐忘茗舍</h1>
    <p>主理人管理后台，请登录</p>
    <div class="form-group">
      <label>邮箱</label>
      <input type="email" id="loginEmail" placeholder="请输入邮箱">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="loginPassword" placeholder="请输入密码" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn-primary" onclick="doLogin()">登录</button>
    <div class="error-msg" id="loginError"></div>
  </div>
</div>

<!-- 管理后台 -->
<div id="adminPage">
  <div class="top-bar">
    <div class="top-bar-title">坐忘茗舍 · 管理后台</div>
    <div class="top-bar-right">
      <span id="userEmail" style="font-size:13px;color:var(--ink-muted)"></span>
      <button class="btn-logout" onclick="openPasswordModal()">修改密码</button>
      <button class="btn-logout" onclick="doLogout()">退出登录</button>
    </div>
  </div>

  <div class="admin-layout">
    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">内容管理</div>
        <button class="sidebar-item active" onclick="switchTab('tea')">精选茗茶</button>
        <button class="sidebar-item" onclick="switchTab('teaware')">茶器美学</button>
        <button class="sidebar-item" onclick="switchTab('guqin')">斫琴甄选</button>
        <button class="sidebar-item" onclick="switchTab('qindao')">琴道传习</button>
        <button class="sidebar-item" onclick="switchTab('yaji')">坐忘雅集</button>
      </div>
    </div>

    <div class="main-content">
      <div class="page-header">
        <div>
          <div class="page-title" id="pageTitle">精选茗茶</div>
          <div class="page-subtitle" id="pageSubtitle">管理茶叶品牌与产品</div>
        </div>
        <button class="btn-add" id="btnAdd" onclick="openAddModal()">+ 添加商品</button>
        <button class="btn-add" id="btnAddPoster" onclick="openPosterUpload()" style="display:none">+ 上传海报</button>
      </div>

      <div class="filter-bar" id="filterBar"></div>
      <div id="productList"><div class="loading">加载中...</div></div>
    </div>
  </div>
</div>

<!-- 添加/编辑商品模态框 -->
<div class="modal-overlay" id="productModal">
  <div class="modal">
    <div class="modal-title" id="modalTitle">添加商品</div>
    <div class="form-group">
      <label>所属分类</label>
      <select id="modalCategory"></select>
    </div>
    <div class="form-group">
      <label>商品名称</label>
      <input type="text" id="modalName" placeholder="例：骏眉红茶 · 特级">
    </div>
    <div class="form-group">
      <label>简介</label>
      <textarea id="modalDesc" placeholder="简短描述这款商品..."></textarea>
    </div>
    <div class="form-group">
      <label>价格（选填）</label>
      <input type="text" id="modalPrice" placeholder="例：¥298 / 100g">
    </div>
    <div class="form-group">
      <label>商品图片（选填）</label>
      <div class="upload-area" id="uploadArea" onclick="document.getElementById('imageFileInput').click()">
        <div id="uploadPlaceholder">点击选择图片，或拖拽图片到此处</div>
        <img id="uploadPreview" style="display:none;max-width:100%;max-height:180px;border-radius:6px;margin-top:8px;">
      </div>
      <input type="file" id="imageFileInput" accept="image/*" style="display:none" onchange="handleImageSelect(event)">
      <div id="uploadStatus" style="font-size:12px;color:var(--ink-muted);margin-top:6px;"></div>
      <input type="hidden" id="modalImage">
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="modalVisible" checked>
      <label for="modalVisible">在网站上显示此商品</label>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-save" onclick="saveProduct()">保存</button>
    </div>
  </div>
</div>

<!-- 修改密码模态框 -->
<div class="modal-overlay" id="passwordModal">
  <div class="modal" style="width:400px">
    <div class="modal-title">修改密码</div>
    <div class="form-group">
      <label>新密码</label>
      <input type="password" id="newPassword" placeholder="至少 6 位">
    </div>
    <div class="form-group">
      <label>确认新密码</label>
      <input type="password" id="confirmPassword" placeholder="再输入一次">
    </div>
    <div class="error-msg" id="passwordError"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closePasswordModal()">取消</button>
      <button class="btn-save" onclick="savePassword()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://wmatsdnpbpcltuoynyrh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_gw7gfFtSHHJR6SbDUpCTwA_HNcktgEl';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let currentTab = 'tea';
let currentFilter = null;
let editingId = null;
let categoriesCache = [];

const tabConfig = {
  tea:      { title: '精选茗茶', subtitle: '管理茶叶品牌与产品', type: 'tea' },
  teaware:  { title: '茶器美学', subtitle: '管理茶器分类与商品', type: 'teaware' },
  guqin:    { title: '斫琴甄选', subtitle: '管理古琴分类与商品', type: 'guqin' },
  qindao:   { title: '琴道传习', subtitle: '管理活动招生海报', type: 'poster', section: 'qindao' },
  yaji:     { title: '坐忘雅集', subtitle: '管理雅集活动海报', type: 'poster', section: 'yaji' },
};

// 登录
async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  document.getElementById('loginError').textContent = '';
  if (!email || !password) { document.getElementById('loginError').textContent = '请填写邮箱和密码'; return; }
  const { error } = await db.auth.signInWithPassword({ email, password });
  if (error) { document.getElementById('loginError').textContent = '邮箱或密码错误'; return; }
  showAdmin();
}

async function doLogout() {
  await db.auth.signOut();
  document.getElementById('adminPage').style.display = 'none';
  document.getElementById('loginPage').style.display = 'flex';
}

async function showAdmin() {
  const { data: { user } } = await db.auth.getUser();
  if (!user) return;
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('adminPage').style.display = 'block';
  document.getElementById('userEmail').textContent = user.email;
  await loadCategories();
  await loadProducts();
}

// 分类
async function loadCategories() {
  const { data } = await db.from('categories').select('*').order('sort_order');
  categoriesCache = data || [];
}

function getCategoriesForTab() {
  return categoriesCache.filter(c => c.type === tabConfig[currentTab].type);
}

function renderFilterBar() {
  const cats = getCategoriesForTab();
  const bar = document.getElementById('filterBar');
  bar.innerHTML = cats.map(c =>
    `<button class="filter-chip ${currentFilter === c.key ? 'active' : ''}" onclick="setFilter('${c.key}')">${c.name}</button>`
  ).join('');
}

function setFilter(key) {
  currentFilter = currentFilter === key ? null : key;
  renderFilterBar();
  loadProducts();
}

// 商品 / 海报 统一加载入口
async function loadProducts() {
  document.getElementById('productList').innerHTML = '<div class="loading">加载中...</div>';
  const cfg = tabConfig[currentTab];

  if (cfg.type === 'poster') {
    document.getElementById('btnAdd').style.display = 'none';
    document.getElementById('btnAddPoster').style.display = '';
    const { data } = await db.from('posters').select('*').eq('section', cfg.section).order('sort_order').order('created_at');
    renderPosters(data || [], cfg.section);
    document.getElementById('filterBar').innerHTML = '';
    return;
  }

  document.getElementById('btnAdd').style.display = '';
  document.getElementById('btnAddPoster').style.display = 'none';
  const cats = getCategoriesForTab().map(c => c.key);
  let query = db.from('products').select('*, categories(name)').in('category_key', cats.length ? cats : ['__none__']).order('is_visible', { ascending: false }).order('sort_order');
  if (currentFilter) query = query.eq('category_key', currentFilter);
  const { data } = await query;
  renderProducts(data || []);
  renderFilterBar();
}

function renderProducts(products) {
  const el = document.getElementById('productList');
  if (!products.length) {
    el.innerHTML = '<div class="empty-state"><div style="font-size:32px">📦</div><p>暂无商品，点击「添加商品」开始</p></div>';
    return;
  }
  el.innerHTML = '<div class="product-list" id="sortableList">' + products.map((p, i) => `

// 图片压缩
function compressImage(file, maxW = 1200, quality = 0.82) {
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.width, h = img.height;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(blob => resolve(blob), 'image/jpeg', quality);
    };
    img.src = url;
  });
}

function handleImageSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  const preview = document.getElementById('uploadPreview');
  const placeholder = document.getElementById('uploadPlaceholder');
  const reader = new FileReader();
  reader.onload = e => {
    preview.src = e.target.result;
    preview.style.display = 'block';
    placeholder.style.display = 'none';
  };
  reader.readAsDataURL(file);
  document.getElementById('uploadStatus').textContent = '图片已选择，保存时自动上传';
}

async function uploadImageIfNeeded() {
  const file = document.getElementById('imageFileInput').files[0];
  if (!file) return document.getElementById('modalImage').value || null;
  document.getElementById('uploadStatus').textContent = '上传中...';
  const compressed = await compressImage(file);
  const ext = 'jpg';
  const filename = `${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
  const { data, error } = await db.storage.from('product-images').upload(filename, compressed, { contentType: 'image/jpeg' });
  if (error) { showToast('图片上传失败'); return null; }
  const { data: { publicUrl } } = db.storage.from('product-images').getPublicUrl(filename);
  document.getElementById('uploadStatus').textContent = '上传成功';
  return publicUrl;
}

async function saveProduct() {
  const name = document.getElementById('modalName').value.trim();
  if (!name) { showToast('请填写商品名称'); return; }
  const imageUrl = await uploadImageIfNeeded();

}

function setVisible(id, visible) {
  const list = document.getElementById('sortableList');
  const row = document.querySelector(`.product-row[data-id="${id}"]`);
  if (!row) return;

  // 更新按钮和徽标
  const showBtn = row.querySelector('.vs-btn-show');
  const hideBtn = row.querySelector('.vs-btn-hide');
  const badge = row.querySelector('.badge-hidden');
  if (visible) {
    showBtn.classList.add('vs-active-show');
    hideBtn.classList.remove('vs-active-hide');
    if (badge) badge.remove();
  } else {
    showBtn.classList.remove('vs-active-show');
    hideBtn.classList.add('vs-active-hide');
    if (!badge) {
      row.querySelector('.product-name').insertAdjacentHTML('beforeend', '<span class="badge-hidden">已隐藏</span>');
    }
  }

  // 移动行位置：隐藏移到最底部，显示移到第一个隐藏行之前
  if (list) {
    if (!visible) {
      list.appendChild(row);
    } else {
      const firstHidden = [...list.querySelectorAll('.product-row')].find(r => r.querySelector('.badge-hidden'));
      if (firstHidden) list.insertBefore(row, firstHidden);
    }
  }

  // 后台保存：可见性 + 重新计算所有行的 sort_order
  const rows = list ? [...list.querySelectorAll('.product-row')] : [];
  const saves = [db.from('products').update({ is_visible: visible }).eq('id', id)];
  rows.forEach((r, i) => { r.dataset.sort = i; saves.push(db.from('products').update({ sort_order: i }).eq('id', r.dataset.id)); });
  Promise.all(saves).then(results => {
    if (results[0].error) setVisible(id, !visible);
  });
}

async function moveProduct(id, direction) {
  const list = document.getElementById('sortableList');
  const rows = [...list.querySelectorAll('.product-row')];
  const idx = rows.findIndex(r => r.dataset.id === id);
  const targetIdx = idx + direction;
  if (targetIdx < 0 || targetIdx >= rows.length) return;

  const rowA = rows[idx];
  const rowB = rows[targetIdx];

  // 动画：先记录各自位置
  const rectA = rowA.getBoundingClientRect();
  const rectB = rowB.getBoundingClientRect();
  const diffA = rectB.top - rectA.top;
  const diffB = rectA.top - rectB.top;

  // DOM 交换
  if (direction === -1) {
    list.insertBefore(rowA, rowB);
  } else {
    list.insertBefore(rowB, rowA);
  }

  // 交换 data-sort
  const sortA = rowA.dataset.sort;
  const sortB = rowB.dataset.sort;
  rowA.dataset.sort = sortB;
  rowB.dataset.sort = sortA;

  // FLIP 动画
  rowA.style.transition = 'none';
  rowB.style.transition = 'none';
  rowA.style.transform = `translateY(${-diffA}px)`;
  rowB.style.transform = `translateY(${-diffB}px)`;
  rowA.offsetHeight; // force reflow
  rowA.style.transition = 'transform 0.25s ease';
  rowB.style.transition = 'transform 0.25s ease';
  rowA.style.transform = '';
  rowB.style.transform = '';

  // 后台保存
  await Promise.all([
    db.from('products').update({ sort_order: parseInt(sortB) }).eq('id', rowA.dataset.id),
    db.from('products').update({ sort_order: parseInt(sortA) }).eq('id', rowB.dataset.id),
  ]);
}

function initDragSort() {
  const list = document.getElementById('sortableList');
  if (!list) return;
  let dragging = null;

  list.addEventListener('dragstart', e => {
    dragging = e.target.closest('.product-row');
    if (!dragging) return;
    setTimeout(() => { dragging.style.opacity = '0.4'; }, 0);
  });

  list.addEventListener('dragend', async e => {
    const el = dragging;
    dragging = null;
    if (!el) return;
    el.style.opacity = '';
    el.style.transition = '';
    const rows = [...list.querySelectorAll('.product-row')];
    await Promise.all(rows.map((r, i) => {
      r.dataset.sort = i;
      return db.from('products').update({ sort_order: i }).eq('id', r.dataset.id);
    }));
  });

  // 兜底：任何情况松手都还原透明度
  document.addEventListener('mouseup', () => {
    document.querySelectorAll('.product-row').forEach(r => r.style.opacity = '');
  });

  list.addEventListener('dragover', e => {
    e.preventDefault();
    if (!dragging) return;
    const target = e.target.closest('.product-row');
    if (!target || target === dragging) return;
    const rect = target.getBoundingClientRect();
    const mid = rect.top + rect.height / 2;
    if (e.clientY < mid) {
      list.insertBefore(dragging, target);
    } else {
      list.insertBefore(dragging, target.nextSibling);
    }
  });
}

async function cropAndCompress(file, ratioW, ratioH) {
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const srcW = img.width, srcH = img.height;
      let cropW = srcW, cropH = Math.round(srcW * ratioH / ratioW);
      if (cropH > srcH) { cropH = srcH; cropW = Math.round(srcH * ratioW / ratioH); }
      const offX = Math.round((srcW - cropW) / 2);
      const offY = Math.round((srcH - cropH) / 2);
      const maxH = 1440;
      const scale = cropH > maxH ? maxH / cropH : 1;
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(cropW * scale);
      canvas.height = Math.round(cropH * scale);
      canvas.getContext('2d').drawImage(img, offX, offY, cropW, cropH, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.85);
    };
    img.src = url;
  });
}

let _posterEditId = null;
let _posterOrigUrl = null;
let _posterNewBlob = null;
let _cropScale = 1, _cropX = 0, _cropY = 0;
let _dragStart = null;

function openPosterEdit(id, title, imageUrl) {
  _posterEditId = id;
  _posterOrigUrl = imageUrl;
  _posterNewBlob = null;
  document.getElementById('posterEditTitle').value = title;
  document.getElementById('posterEditOverlay').style.display = 'flex';
  loadCropImage(imageUrl);
}

function loadCropImage(url) {
  const img = document.getElementById('posterCropImg');
  const frame = document.getElementById('posterCropFrame');
  const zoom = document.getElementById('posterZoom');
  _cropScale = 1; _cropX = 0; _cropY = 0;
  zoom.value = 1;
  img.onload = () => {
    // 初始让图片铺满 frame
    const fw = frame.clientWidth, fh = frame.clientHeight;
    const fitScale = Math.max(fw / img.naturalWidth, fh / img.naturalHeight);
    _cropScale = fitScale;
    zoom.min = fitScale * 0.8;
    zoom.max = fitScale * 4;
    zoom.step = fitScale * 0.01;
    zoom.value = fitScale;
    _cropX = (fw - img.naturalWidth * fitScale) / 2;
    _cropY = (fh - img.naturalHeight * fitScale) / 2;
    applyTransform();
  };
  img.src = url;
}

function applyTransform() {
  const img = document.getElementById('posterCropImg');
  img.style.transform = `translate(${_cropX}px, ${_cropY}px) scale(${_cropScale})`;
  img.style.transformOrigin = '0 0';
}

document.getElementById('posterZoom').addEventListener('input', function() {
  const frame = document.getElementById('posterCropFrame');
  const img = document.getElementById('posterCropImg');
  const fw = frame.clientWidth, fh = frame.clientHeight;
  const cx = fw / 2, cy = fh / 2;
  const oldScale = _cropScale;
  _cropScale = parseFloat(this.value);
  // 以中心点为基准缩放
  _cropX = cx - (_cropScale / oldScale) * (cx - _cropX);
  _cropY = cy - (_cropScale / oldScale) * (cy - _cropY);
  applyTransform();
});

const frame = document.getElementById('posterCropFrame');
frame.addEventListener('mousedown', e => {
  e.preventDefault();
  _dragStart = { x: e.clientX - _cropX, y: e.clientY - _cropY };
  frame.style.cursor = 'grabbing';
});
document.addEventListener('mousemove', e => {
  if (!_dragStart) return;
  _cropX = e.clientX - _dragStart.x;
  _cropY = e.clientY - _dragStart.y;
  applyTransform();
});
document.addEventListener('mouseup', () => { _dragStart = null; frame.style.cursor = 'grab'; });

// 触屏拖拽
frame.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    _dragStart = { x: e.touches[0].clientX - _cropX, y: e.touches[0].clientY - _cropY };
  }
}, { passive: true });
frame.addEventListener('touchmove', e => {
  if (!_dragStart || e.touches.length !== 1) return;
  e.preventDefault();
  _cropX = e.touches[0].clientX - _dragStart.x;
  _cropY = e.touches[0].clientY - _dragStart.y;
  applyTransform();
}, { passive: false });
frame.addEventListener('touchend', () => { _dragStart = null; });

function triggerPosterReplace() {
  document.getElementById('posterReplaceInput').click();
}
document.getElementById('posterReplaceInput').addEventListener('change', function() {
  const file = this.files[0];
  if (!file) return;
  _posterNewBlob = file;
  loadCropImage(URL.createObjectURL(file));
});

function closePosterEdit() {
  document.getElementById('posterEditOverlay').style.display = 'none';
  _posterEditId = null;
  _posterNewBlob = null;
}

async function savePosterEdit() {
  if (!_posterEditId) return;
  const title = document.getElementById('posterEditTitle').value.trim();
  showToast('保存中…');

  let imageUrl = _posterOrigUrl;

  if (_posterNewBlob) {
    // 有换图：先裁剪成当前视口所见区域，再上传
    const frame = document.getElementById('posterCropFrame');
    const img = document.getElementById('posterCropImg');
    const fw = frame.clientWidth, fh = frame.clientHeight;
    const canvas = document.createElement('canvas');
    const outW = 810, outH = 1080; // 3:4 输出分辨率
    canvas.width = outW; canvas.height = outH;
    const ctx = canvas.getContext('2d');
    // 把当前可见区域画到 canvas
    const scaleX = outW / fw, scaleY = outH / fh;
    ctx.save();
    ctx.scale(scaleX, scaleY);
    ctx.translate(_cropX, _cropY);
    ctx.scale(_cropScale, _cropScale);
    ctx.drawImage(img, 0, 0);
    ctx.restore();
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.88));
    const filename = `poster_edit_${_posterEditId}_${Date.now()}.jpg`;
    const { error } = await db.storage.from('product-images').upload(filename, blob, { contentType: 'image/jpeg', upsert: true });
    if (error) { showToast('图片上传失败'); return; }
    imageUrl = db.storage.from('product-images').getPublicUrl(filename).data.publicUrl;
  }

  await db.from('posters').update({ title: title || null, image_url: imageUrl }).eq('id', _posterEditId);
  showToast('已保存');
  closePosterEdit();
  loadProducts();
}

      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
        <span style="font-size:11px;color:var(--ink-muted)">缩小</span>
        <input type="range" id="posterZoom" min="0.5" max="3" step="0.01" value="1" style="flex:1">
        <span style="font-size:11px;color:var(--ink-muted)">放大</span>
      </div>
      <button onclick="triggerPosterReplace()" style="margin-top:8px;font-size:12px;padding:5px 12px;border:1px solid var(--border);background:var(--surface);border-radius:6px;cursor:pointer;color:var(--ink-muted)">换一张图片</button>
      <input type="file" id="posterReplaceInput" accept="image/*" style="display:none">
    </div>

    <div style="margin-bottom:18px">
      <label style="font-size:13px;color:var(--ink-muted);display:block;margin-bottom:6px">显示文字（可留空）</label>
      <input type="text" id="posterEditTitle" placeholder="例：秋季古琴入门小班" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;box-sizing:border-box">
    </div>

    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button onclick="closePosterEdit()" style="padding:9px 18px;border:1px solid var(--border);background:white;border-radius:8px;cursor:pointer;font-size:14px">取消</button>
      <button onclick="savePosterEdit()" style="padding:9px 22px;background:var(--gold);color:white;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px">保存</button>
    </div>
  </div>
</div>
</body>
</html>
